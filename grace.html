<style>
  :root{
    --bg:#04060c; --panel:rgba(10,15,28,.92); --line:#1c2a44;
    --blue:#3fa9ff; --purple:#b06bff; --text:#e8f1ff; --muted:#7d93ad;
    --green:#3dffa2; --amber:#ffb347;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(1100px 700px at 50% 30%, #0a1230 0%, var(--bg) 65%);
    color:var(--text); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    overflow:hidden; user-select:none;
  }
  /* ---------- top buttons ---------- */
  #menuBtn{
    position:fixed; top:18px; right:22px; z-index:40;
    width:46px; height:46px; border-radius:12px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:22px;
    transition:.2s; backdrop-filter:blur(6px);
  }
  #menuBtn:hover{border-color:var(--blue); box-shadow:0 0 14px rgba(63,169,255,.35);}
  #statusLine{
    position:fixed; top:24px; left:88px; z-index:40; display:flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:2px; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:8px 14px;
    backdrop-filter:blur(6px);
  }
  #statusDot{width:9px; height:9px; border-radius:50%; background:#5a6a80; transition:.2s;}
  #statusDot.live{background:var(--green); box-shadow:0 0 10px var(--green); animation:blink 1.6s infinite;}
  @keyframes blink{50%{opacity:.4;}}
  /* ---------- stage: classic centered HUD by default ---------- */
  #stage{
    position:fixed; inset:0; z-index:30; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; gap:6px;
  }
  #hudCore{display:flex; flex-direction:column; align-items:center; gap:6px; will-change:transform;}
  #ringWrap{line-height:0;}
  #ring{width:min(52vmin,420px); height:min(52vmin,420px); background:transparent; border:none; outline:none; display:block;}
  #ringWrap{background:transparent; border:none; outline:none;}
  #subtitle{
    margin-top:14px; font-size:clamp(16px,2.6vmin,22px); color:#f2f6ff; text-align:center;
    max-width:min(700px,86vw); min-height:1.6em; line-height:1.5;
    text-shadow:0 0 18px rgba(120,130,255,.45); font-weight:300;
    transition:opacity .45s ease;
  }
  /* ---------- popups open: HUD morphs to compact, subtitles go thin ---------- */
  body.popups-open #stage{justify-content:flex-end; align-items:flex-start; padding:0 0 102px 18px;}
  body.popups-open #hudCore{align-items:flex-start;}
  body.popups-open #ring{width:150px; height:150px;}
  body.popups-open #subtitle{
    position:fixed; left:0; right:0; bottom:58px; z-index:45; margin-top:0; max-width:none; min-height:0;
    font-size:13px; font-weight:400; color:#cfdcf2; text-align:center; text-shadow:none; line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    padding:7px 16px; background:rgba(4,8,16,.72); backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
    animation:subIn .4s ease;
  }
  @keyframes subIn{from{opacity:0;}}
  /* ---------- dock ---------- */
  #dock{position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; align-items:center; gap:8px; transition:margin-right .3s, opacity .45s ease, transform .45s ease;}
  #dock.dock-hidden{opacity:0; pointer-events:none; transform:translateX(-50%) translateY(12px);}
  body.panel-open #dock{margin-right:320px;}
  #typeRow{display:flex; gap:8px; width:min(480px,86vw); margin-top:12px; pointer-events:auto;}
  #typeRow input{
    flex:1; padding:12px 14px; font-size:15px; border-radius:12px; border:1px solid var(--line);
    background:rgba(10,19,34,.9); color:var(--text); outline:none;
  }
  #typeRow input:focus{border-color:var(--blue);}
  #typeRow button{
    padding:12px 16px; font-size:14px; cursor:pointer; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); color:var(--text); transition:.15s;
    backdrop-filter:blur(6px);
  }
  #typeRow button:hover{border-color:var(--blue); box-shadow:0 0 12px rgba(63,169,255,.3);}
  body.popups-open #typeRow{width:230px; margin-top:8px;}
  body.popups-open #typeRow input{padding:8px 10px; font-size:13px;}
  body.popups-open #typeRow button{padding:8px 10px; font-size:12px;}
  .dbtn{
    padding:12px 16px; font-size:14px; cursor:pointer; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); color:var(--text); transition:.15s;
    backdrop-filter:blur(6px);
  }
  .dbtn:hover{border-color:var(--blue); box-shadow:0 0 12px rgba(63,169,255,.3);}
  #dockBtns{display:flex; align-items:center; gap:10px;}

<script>
"use strict";
/* ============================================================
   Grace — single-file voice assistant (HUD edition).
   ============================================================ */

// ---------- storage ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem("grace_"+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("grace_"+k, JSON.stringify(v)); }catch(e){} }
};

// ---------- state ----------
const S = {
  listening:false, recog:null, awaiting:false, buffer:"",
  micOn:false, // soft toggle: the recognition stream stays alive, we just ignore input
  micStream:null, // held getUserMedia stream: one permission grant per page load
  micStarting:false, // true while a permission prompt is already up (never stack prompts)
  lastRestart:0, // debounce for recognition restarts
  resumeTimer:null, // interval that unsticks Chrome's paused speech while talking
  speechWatch:null, // watchdog that clears a stuck "speaking" glow
  followUpUntil:0, // 2s after she speaks: no wake word needed to talk to her
  ignoreUntil:0, muted: store.get("muted", false),
  name: store.get("name","Jessica"),         // user's name
  aiName: store.get("aiName","Grace"),    // assistant's display name
  webAccess: store.get("webAccess", true),
  memories: store.get("memories", []),
  loc: store.get("loc", null),
  timers: [], lastSpoken:"", hist:[], orbMode:"idle", wakeLock:null, pulse:0,
  gen:0, genCancel:false // gen>0 while she's generating; mic ignores everything but "luna" then
};
// one-time migration: role-based names ("Mom") become real first names
if(S.name==="Mom"){ S.name="Jessica"; store.set("name","Jessica"); }

// true while Grace is in the middle of generating anything
function generating(){ return (S.gen||0)>0; }
function genStart(){ S.gen=(S.gen||0)+1; S.genCancel=false; S.orbMode="thinking"; pokeDock(); return S.gen; }
function genEnd(){ S.gen=Math.max(0,(S.gen||0)-1); if(!S.gen&&S.orbMode==="thinking"){ S.orbMode="idle"; pokeDock(); } }
// called when the wake word breaks through mid-generation: long jobs check this and stop quietly
function cancelGen(){ if(generating()) S.genCancel=true; }
// run an async one-shot job as "generating" so the mic gate stays up until it settles
async function runGen(fn){ genStart(); try{ return await fn(); }finally{ genEnd(); } }

// ---------- dom ----------
const $ = id => document.getElementById(id);
const logEl=$("transcriptLog"), subtitleEl=$("subtitle"),
      statusText=$("statusText"), statusDot=$("statusDot"),
      btnMic=$("btnMic"), btnMute=$("btnMute"), btnRepeat=$("btnRepeat"),
      btnAttach=$("btnAttach"), btnTranscript=$("btnTranscript"),
      textIn=$("textIn"), btnAsk=$("btnAsk"), typeRow=$("typeRow"), fileIn=$("fileIn"),
      dockEl=$("dock");

// ---------- dock: shrinks away when Grace is idle ----------
// buttons hide a few seconds after she finishes speaking; they come back
// while she talks, when the mic is tapped, or when the mouse nears the bottom.
let dockHideT=null;
function pokeDock(){
  dockEl.classList.remove("dock-hidden");
  clearTimeout(dockHideT);
  dockHideT=setTimeout(()=>{
    if(S.orbMode==="speaking"||S.awaiting) return;
    dockEl.classList.add("dock-hidden");
  },2600);
}
document.addEventListener("mousemove",e=>{
  if(e.clientY>window.innerHeight-110) pokeDock();
});

// ---------- settings panel ----------
const menuBtn=$("menuBtn"), settingsClose=$("settingsClose");
function toggleSettings(force){
  const open = force!==undefined ? force : !document.body.classList.contains("panel-open");
  document.body.classList.toggle("panel-open", open);
  $("panelScrim").classList.toggle("hidden", !open);
  if(!$("aboutWin").classList.contains("hidden")) setTimeout(placeAbout, 320);
}
menuBtn.onclick=()=>toggleSettings();
$("notesBtn").onclick=()=>toggleNotes();
settingsClose.onclick=()=>toggleSettings(false);
$("panelScrim").onclick=()=>toggleSettings(false);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ toggleSettings(false); toggleNotes(false); closeMini(); hideAnswerCard(); closeDoc(); closeNoteView(); }
});
// settings panel starts closed; the user opens it with the ☰ button

// ---------- transcript ----------
btnTranscript.onclick=()=>$("transcript").classList.toggle("hidden");
$("transcriptClose").onclick=()=>$("transcript").classList.add("hidden");

// ---------- about ----------

// ---------- ring (voice-reactive) ----------
const ring=$("ring"), rctx=ring.getContext("2d");
let ringT=0, amp=0;
function sizeRing(){
  const css=Math.min(Math.min(window.innerWidth,window.innerHeight)*0.52, 420);
  const dpr=Math.min(2, window.devicePixelRatio||1);
  ring.style.width=ring.style.height=css+"px";
  ring.width=ring.height=Math.round(css*dpr);
  ring._s=ring.width;
}
window.addEventListener("resize", sizeRing);
sizeRing();

function draw(){
  ringT+=0.016;
  const speaking = S.orbMode==="speaking";
  // while she speaks the orb pulses bright and lively with her voice
  const target = speaking ? 0.78 : S.listening ? 0.35 : 0.18;
  amp += (target-amp)*0.07;
  S.pulse = Math.max(0, S.pulse-0.045);
  // flicker envelope while speaking — the orb breathes with her voice
  const fl = speaking ? (0.5+0.5*Math.sin(ringT*17))*(0.5+0.5*Math.sin(ringT*8.3)) : 0;
  const A = Math.min(1, amp + S.pulse*0.9 + fl*0.45);

  const w=ring._s, cx=w/2, cy=w/2, R=w*0.30;
  rctx.clearRect(0,0,w,w);

  // soft honey-peach halo behind the orb
  const haloR=Math.min(R*2.1,w*0.49);
  const halo=rctx.createRadialGradient(cx,cy,R*0.4,cx,cy,haloR);
  halo.addColorStop(0,"rgba(238,168,100,"+(0.28+A*0.35).toFixed(3)+")");
  halo.addColorStop(1,"rgba(238,168,100,0)");
  rctx.fillStyle=halo;
  rctx.beginPath(); rctx.arc(cx,cy,haloR,0,Math.PI*2); rctx.fill();

  // the honey-gold orb itself — bright core, warm rim
  const rr=R*(1+A*0.10);
  const g=rctx.createRadialGradient(cx-rr*0.35,cy-rr*0.4,rr*0.1,cx,cy,rr);
  g.addColorStop(0,"#fff6e8");
  g.addColorStop(0.45,"#ffdfae");
  g.addColorStop(0.8,"#eeaa4a");
  g.addColorStop(1,"#bd7a1a");
  rctx.save();
  rctx.shadowColor="rgba(235,165,90,"+(0.55+A*0.45).toFixed(3)+")";
  rctx.shadowBlur=Math.min(24+A*70,Math.max(0,w*0.5-rr-6));
  rctx.fillStyle=g;
  rctx.beginPath(); rctx.arc(cx,cy,rr,0,Math.PI*2); rctx.fill();
  rctx.restore();

  // thin bright rim
  rctx.save();
  rctx.strokeStyle="rgba(255,244,214,"+(0.5+A*0.5).toFixed(3)+")";
  rctx.lineWidth=2.5;
  rctx.beginPath(); rctx.arc(cx,cy,rr-1.5,0,Math.PI*2); rctx.stroke();
  rctx.restore();

  // gentle sparkles drifting around the orb
  rctx.save();
  for(let i=0;i<7;i++){
    const a=ringT*0.35+i*(Math.PI*2/7);
    const d=Math.min(rr+22+Math.sin(ringT*0.9+i*1.7)*10,w*0.47);
    const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d*0.85;
    const tw=0.25+0.55*Math.abs(Math.sin(ringT*1.6+i*2.1))*(speaking?1:0.45);
    rctx.fillStyle="rgba(255,220,150,"+tw.toFixed(3)+")";
    rctx.beginPath(); rctx.arc(x,y,1.6+tw*2.2,0,Math.PI*2); rctx.fill();
  }
  rctx.restore();

  requestAnimationFrame(draw);
}
draw();

// ---------- chat / subtitle ----------
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function addMsg(who, text, html){
  const d=document.createElement("div");
  d.className="msg "+(who==="you"?"you":"luna");
  d.innerHTML='<span class="who">'+(who==="you"?"YOU":esc(S.aiName))+"</span>"+(html||esc(text));
  logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight;
}
function setSubtitle(t){ subtitleEl.style.opacity="1"; subtitleEl.textContent=t; }
function hideSubtitle(){
  subtitleEl.style.opacity="0";
  setTimeout(()=>{ if(subtitleEl.style.opacity==="0") subtitleEl.textContent=""; },480);
}
// brief listen window (e.g. after a failure): listen for `ms`, then reset
function listenBriefly(ms){
  S.awaiting=true; cmdBuf="";
  S.followUpUntil=Date.now()+ms;
  clearTimeout(listenBriefly._t);
  listenBriefly._t=setTimeout(()=>{
    if(S.awaiting){ S.awaiting=false; S.orbMode="idle"; S.buffer=""; cmdBuf=""; }
  },ms);
}
// uniform failure: say sorry, then give 3s to repeat before resetting
function loadFail(){
  const msg="I'm sorry, could you say that again?";
  addMsg("luna",msg);
  speak(msg,{chat:false,onDone:()=>{ listenBriefly(3000); }});
}

// ---------- answer card (image popup while she talks) ----------
let answerHideT=null;
// when a popup opens/closes, the HUD morphs: big centered logo <-> compact corner logo.
// FLIP animation: measure first, toggle class, measure last, then animate the difference.
function syncPopupLayout(){
  const hud=$("hudCore"); if(!hud) return;
  const anyOpen=!$("miniWin").classList.contains("hidden")||!$("answerCard").classList.contains("hidden")||!$("noteView").classList.contains("hidden");
  const isOpen=document.body.classList.contains("popups-open");
  if(anyOpen===isOpen) return;
  const first=hud.getBoundingClientRect();
  document.body.classList.toggle("popups-open",anyOpen);
  const last=hud.getBoundingClientRect();
  const dx=first.left-last.left, dy=first.top-last.top;
  const sx=first.width/Math.max(1,last.width), sy=first.height/Math.max(1,last.height);
  hud.style.transformOrigin="top left";
  hud.style.transition="none";
  hud.style.transform="translate("+dx+"px,"+dy+"px) scale("+sx+","+sy+")";
  void hud.offsetWidth;
  hud.style.transition="transform .5s cubic-bezier(.22,.8,.3,1)";
  hud.style.transform="";
}
function showAnswerCard(o){
  clearTimeout(answerHideT);
  $("answerTitle").textContent=o.title||"";
  $("answerText").textContent=o.text||"";
  const img=$("answerImg");
  if(o.image){ img.src=o.image; img.classList.remove("hidden"); }
  else{ img.removeAttribute("src"); img.classList.add("hidden"); }
  $("answerCard").classList.remove("hidden");
  syncPopupLayout();
}
function hideAnswerCard(){ clearTimeout(answerHideT); $("answerCard").classList.add("hidden"); syncPopupLayout(); }
$("answerClose").onclick=hideAnswerCard;
// call when her answer finishes: the card lingers a beat, then closes
function cardUntilDone(){ clearTimeout(answerHideT); answerHideT=setTimeout(hideAnswerCard,1400); }

// ---------- speech ----------
function pickVoice(){
  // device fallback voice (used only if the internet voice is unreachable):
  // warmest US-English female available (Samantha on Apple devices).
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
  const warm=/samantha|joanna|zira|karen|google us english/i;
  return vs.find(v=>warm.test(v.name)) || vs[0] || null;
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=()=>{}; pickVoice(); }

function beep(freq,dur,when){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=beep.ctx||(beep.ctx=new C());
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=freq;
    const t=ctx.currentTime+(when||0);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function chime(){ beep(880,0.12,0); beep(1320,0.16,0.12); }

// low-level utterance: drives the reactive ring via onboundary pulses.
// speakToken guarantees only the newest utterance ever starts: if a newer
// speak() arrives while this one is still queued, the older one is dropped
// instead of starting, getting cut, and restarting (the stutter bug).
/* ============ INTERNET VOICE (ResponsiveVoice TTS, free keyless) ============
   REPLACES the whole span in grace.html starting at the comment line
     // prompt + type bubble fade while someone is talking:
   through the end of utter() (the line right before `function speak(text){`).
   PER-BUILD: set USE_NET_VOICE=true and NET_VOICE_NAME below.
     Melodie:  "UK English Female" (warm female)
     Ace:      "UK English Male"   (British male)
     Grace:    "US English Female" (warm US female)
     Barnabas: "US English Male"   (deep US male)
   Also required (see build brief):
   - after EVERY `speechSynthesis.cancel()` outside this block, add `stopNetAudio();`
     (interrupt path ~line 835, and the watchdog inside deviceUtter is already handled)
   - replace `!speechSynthesis.speaking` in the email follow-up check with `!aiSpeaking()`
   - replace `speechSynthesis.speaking && INTERRUPT_RE` with `(speechSynthesis.speaking||netAudioEl) && INTERRUPT_RE`
*/

// prompt + type bubble fade while someone is talking:
// hidden when the user speaks, back only when SHE finishes her reply.
function hidePrompt(){ for(const id of ["wakeHint","typeRow"]){ const h=$(id); if(h) h.classList.add("faded"); } }
function showPrompt(){ for(const id of ["wakeHint","typeRow"]){ const h=$(id); if(h) h.classList.remove("faded"); } }

// ---- internet voice config (PER-BUILD) ----
const USE_NET_VOICE = true;
const NET_VOICE_NAME = "US English Female"; // Grace: warm US female (ResponsiveVoice, internet)
const NET_VOICE_TL = "en-US";
const NET_VOICE_PITCH = "0.5"; // 0.5 = default; lower = deeper
const NET_VOICE_RATE = "0.5"; // 0.5 = default; lower = slower

let speakToken=0;
let netAudioEl=null;
function stopNetAudio(){ try{ if(netAudioEl){ netAudioEl.pause(); netAudioEl.removeAttribute("src"); netAudioEl.load(); } }catch(e){} netAudioEl=null; }
function aiSpeaking(){
  try{ if(speechSynthesis.speaking||speechSynthesis.pending) return true; }catch(e){}
  return !!netAudioEl;
}

// the words and the voice start together, every time: nothing is displayed
// until her audio actually begins (works for both net and device voices)
function utter(text,onDone,onStart){
  S.lastSpoken=text;
  if(S.muted){
    // muted: show the caption briefly, then hide it like speech did
    setTimeout(()=>{ hideSubtitle(); clearTimeout(S.promptRestoreT); showPrompt(); if(onDone)onDone(); pokeDock(); }, Math.min(4000, 1200+text.split(/\s+/).length*280));
    return;
  }
  const my=++speakToken;
  // onStart fires the moment her audio actually begins — exactly once, and
  // never for an utterance that got superseded
  let started=false;
  const fireStart=()=>{ if(started) return; started=true; if(my===speakToken&&onStart){ try{onStart();}catch(e){} } };
  setTimeout(fireStart,15000); // backstop: the words never stay hidden forever
  // hard-stop anything current. No resume() here: resuming at this point can
  // briefly revive a paused corpse utterance -> start/stop/restart stutter.
  try{ if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel(); }catch(e){}
  stopNetAudio();
  clearInterval(S.resumeTimer); clearTimeout(S.speechWatch);
  if(USE_NET_VOICE){ netUtter(text,my,onDone,fireStart); return; }
  deviceUtter(text,my,onDone,fireStart);
}

function netUtter(text,my,onDone,onStart){
  const words=text.split(/\s+/).length;
  const fin=()=>{
    clearInterval(S.resumeTimer); clearTimeout(S.speechWatch);
    if(S.orbMode==="speaking") S.orbMode="idle";
    // 2s follow-up window: she'll hear you without the wake word
    S.followUpUntil=Date.now()+2000;
    // her subtitles fade out when she stops talking
    hideSubtitle();
    // she's done talking: bring the prompt + type bubble back
    clearTimeout(S.promptRestoreT); showPrompt();
    if(onDone)onDone(); pokeDock();
  };
  S.ignoreUntil=Date.now()+Math.min(12000,1200+words*380);
  S.orbMode="speaking"; S.pulse=1; pokeDock();
  // cosmetic ring pulse while the network audio plays (no onboundary here)
  clearInterval(S.resumeTimer);
  S.resumeTimer=setInterval(()=>{ S.pulse=1; },900);
  // long replies are split into sentence chunks — one mp3 per chunk, played
  // back to back, so a long answer never gets cut off mid-sentence
  const parts=String(text).match(/[^.!?]+[.!?]+["'”)’]?|[^.!?]+$/g)||[String(text)];
  const chunks=[];
  let cur="";
  for(const part of parts){
    if((cur.length+part.length)>700){ if(cur.trim()) chunks.push(cur.trim()); cur=part; }
    else cur=cur?cur+" "+part:part;
  }
  if(cur.trim()) chunks.push(cur.trim());
  let ci=0, finished=false;
  const doneAll=()=>{ if(finished||my!==speakToken) return; finished=true; netAudioEl=null; if(onStart)onStart(); fin(); };
  const fallBack=()=>{ if(finished||my!==speakToken) return; finished=true; netAudioEl=null; deviceUtter(text,my,onDone,onStart); };
  const playChunk=()=>{
    if(finished||my!==speakToken) return;
    if(ci>=chunks.length){ doneAll(); return; }
    const a=(audioUnlocked&&ttsAudio)||new Audio();
    try{ a.volume=1; }catch(e){}
    try{ a.pause(); }catch(e){}
    netAudioEl=a;
    const chunkDone=()=>{ if(finished||my!==speakToken) return; ci++; playChunk(); };
    a.onended=chunkDone;
    a.onplaying=()=>{ if(onStart) onStart(); }; // words appear the moment the audio starts
    a.onerror=fallBack;
    a.src="https://code.responsivevoice.org/getvoice.php?t="+encodeURIComponent(chunks[ci])+
          "&tl="+NET_VOICE_TL+"&sv=g1&vn="+encodeURIComponent(NET_VOICE_NAME)+"&pitch="+NET_VOICE_PITCH+"&rate="+NET_VOICE_RATE+"&vol=1";
    try{ a.load(); }catch(e){}
    try{
      const p=a.play();
      if(p&&p.catch) p.catch(fallBack);
    }catch(e){ fallBack(); return; }
    clearTimeout(S.speechWatch);
    // if the mp3 hasn't started in 10s, the endpoint is flaky -> device voice
    S.speechWatch=setTimeout(()=>{ if(!finished&&my!==speakToken&&(a.paused||a.currentTime===0)) fallBack(); },10000);
  };
  if(!chunks.length){ doneAll(); return; }
  playChunk();
  // absolute cap so a stuck stream can't talk forever
  setTimeout(()=>{ if(!finished&&my!==speakToken) doneAll(); },180000);
}


// device-voice path: the original utter() body, used as automatic fallback
function deviceUtter(text,my,onDone,onStart){
  const u=new SpeechSynthesisUtterance(text);
  try{ u.volume=1; }catch(e){}
  const v=pickVoice(); if(v) u.voice=v;
  u.rate=1.02; u.pitch=1;
  u.onstart=()=>{
    if(onStart)onStart(); // her words appear the moment her voice starts
    S.orbMode="speaking"; S.pulse=1; pokeDock();
    // unstick Chrome's paused-speech bug, but only while actually speaking
    clearInterval(S.resumeTimer);
    S.resumeTimer=setInterval(()=>{ try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){} },5000);
  };
  u.onboundary=()=>{ S.pulse=1; };           // each spoken word kicks the ring
  const fin=()=>{
    if(onStart)onStart(); // safety: words show even if speech errored instantly
    clearInterval(S.resumeTimer); clearTimeout(S.speechWatch);
    if(S.orbMode==="speaking") S.orbMode="idle";
    // 2s follow-up window: she'll hear you without the wake word
    S.followUpUntil=Date.now()+2000;
    // her subtitles fade out when she stops talking
    hideSubtitle();
    // she's done talking: bring the prompt + type bubble back
    clearTimeout(S.promptRestoreT); showPrompt();
    if(onDone)onDone(); pokeDock();
  };
  u.onend=fin; u.onerror=fin;
  const words=text.split(/\s+/).length;
  S.ignoreUntil=Date.now()+Math.min(12000,1200+words*380);
  // watchdog: if Chrome leaves an utterance stuck (ring glowing, no audio,
  // no onend), clear it instead of "talking" forever
  S.speechWatch=setTimeout(()=>{
    if(S.orbMode==="speaking"&&my===speakToken){
      try{ speechSynthesis.cancel(); }catch(e){} stopNetAudio();
      S.orbMode="idle"; clearTimeout(S.promptRestoreT); showPrompt(); pokeDock();
    }
  },Math.min(30000,6000+words*650));
  // tiny delay lets Chrome's async cancel() settle before the new voice starts
  setTimeout(()=>{
    if(my!==speakToken) return;
    try{ speechSynthesis.speak(u); }catch(e){}
  },100);
}

function sportsIntent(q){
  const t=" "+String(q||"").toLowerCase().replace(/[^a-z0-9' ]/g," ")+" ";
  if(/\bscores?\b/.test(t)) return true;
  if(/\bwho won\b|\bwho beat\b/.test(t)) return true;
  if(/\bdid\b.{0,40}\bwin\b/.test(t)) return true;
  return false;
}
function extractTeam(q){
  const stop=new Set(("whats what is the score scores of a an game did do does win won beat who by last "+
    "night yesterday final how are they doing tell me s in tonight today versus vs").split(" "));
  return String(q||"").toLowerCase().replace(/[^a-z0-9 ]/g," ")
    .split(/\s+/).filter(w=>w&&!stop.has(w)).join(" ").trim();
}
function espnComps(ev){
  try{ return ev.competitions[0].competitors||[]; }catch(e){ return []; }
}
function teamMatches(ev,query){
  const toks=String(query||"").toLowerCase().split(" ").filter(Boolean);
  if(!toks.length) return false;
  return espnComps(ev).some(c=>{
    const nm=String((c.team&&c.team.displayName)||"").toLowerCase();
    const ab=String((c.team&&c.team.abbreviation)||"").toLowerCase();
    if(toks.length===1&&ab===toks[0]) return true;
    return toks.every(tk=>nm.includes(tk));
  });
}
function evState(ev){
  try{ return ev.status.type.state; }catch(e){ return ""; } // pre | in | post
}
function evScoreLines(ev){
  const out={};
  espnComps(ev).forEach(c=>{
    out[c.homeAway]={name:(c.team&&c.team.displayName)||"",abbr:(c.team&&c.team.abbreviation)||"",
      logo:(c.team&&c.team.logo)||"",score:c.score||"0"};
  });
  return out;
}
function evStatusText(ev){
  try{
    const st=ev.status, d=st.type.description||"";
    if(evState(ev)==="in"){
      const clk=st.displayClock||"", per=st.period||"";
      const perName=(st.type.detail||"").split(" - ")[0]||("period "+per);
      return d+(perName?(" · "+perName):"")+(clk?(" · "+clk):"");
    }
    if(evState(ev)==="pre"){
      const dt=new Date(ev.date);
      return "Upcoming · "+dt.toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    }
    return "Final";
  }catch(e){ return ""; }
}
async function fetchLeagueBoard(L){
  const ctl=new AbortController();
  const to=setTimeout(()=>{try{ctl.abort();}catch(e){}},12000);
  try{
    const r=await fetch("https://site.api.espn.com/apis/site/v2/sports/"+L.sport+"/"+L.league+"/scoreboard",
      {signal:ctl.signal});
    if(!r.ok) return [];
    const d=await r.json();
    return (d.events||[]).map(ev=>({ev,league:L}));
  }catch(e){ return []; }
  finally{ clearTimeout(to); }
}
async function findGame(query){
  const hintId=TEAM_HINTS[query]||TEAM_HINTS[query.split(" ").pop()]||null;
  const ordered=SPORTS_LEAGUES.slice().sort((a,b)=>(a.id===hintId?-1:0)-(b.id===hintId?-1:0));
  const boards=await Promise.all(ordered.map(fetchLeagueBoard));
  const matches=[];
  boards.forEach(list=>list.forEach(({ev,league})=>{
    if(teamMatches(ev,query)) matches.push({ev,league});
  }));
  if(!matches.length) return null;
  const rank=m=>{
    const s=evState(m.ev);
    return (s==="in"?0:s==="pre"?1:2);
  };
  matches.sort((a,b)=>{
    const r=rank(a)-rank(b);
    if(r) return r;
    const da=new Date(a.ev.date).getTime(), db=new Date(b.ev.date).getTime();
    return rank(a)===1 ? da-db : db-da; // soonest upcoming, most recent final
  });
  return matches[0];
}
function sportsSpeech(m){
  const L=evScoreLines(m.ev), st=evState(m.ev);
  const home=L.home||{}, away=L.away||{};
  const hs=parseInt(home.score||"0",10), as=parseInt(away.score||"0",10);
  if(st==="in"){
    const clk=(m.ev.status&&m.ev.status.displayClock)||"";
    const per=((m.ev.status&&m.ev.status.type&&m.ev.status.type.detail)||"").split(" - ")[0];
    return "Right now in the "+m.league.label+": "+away.name+" "+as+", "+home.name+" "+hs+
      (per?(", "+per.toLowerCase()):"")+(clk?(", "+clk+" left."):".");
  }
  if(st==="pre"){
    const dt=new Date(m.ev.date);
    const when=dt.toLocaleString([], {weekday:"long",hour:"numeric",minute:"2-digit"});
    return "The "+away.name+" play the "+home.name+" "+when+".";
  }
  const winner=hs>as?home:away, loser=hs>as?away:home;
  const ws=hs>as?hs:as, ls=hs>as?as:hs;
  if(hs===as) return "It's a tie in the "+m.league.label+": "+away.name+" "+as+", "+home.name+" "+hs+", final.";
  return "Final in the "+m.league.label+": the "+winner.name+" beat the "+loser.name+", "+ws+" to "+ls+".";
}
function openSportsCard(m){
  const L=evScoreLines(m.ev), st=evState(m.ev);
  const home=L.home||{}, away=L.away||{};
  document.body.classList.add("sports-open");
  const card=$("sportsCard");
  card.innerHTML=
    '<div class="sp-league">'+m.league.label+' · '+evStatusText(m.ev)+'</div>'+
    '<div class="sp-row">'+
      '<div class="sp-team">'+(away.logo?'<img src="'+away.logo+'" alt="">':"")+
        '<div class="sp-name">'+away.name+'</div><div class="sp-score">'+away.score+'</div></div>'+
      '<div class="sp-vs">@</div>'+

        '<div class="sp-name">'+home.name+'</div><div class="sp-score">'+home.score+'</div></div>'+
    '</div>'+

      if(f){ m.ev=f.ev; if(evState(f.ev)!=="in"){ clearInterval(S.sportsTimer); } openSportsCard(m); }
    },30000);
  }
}
function closeSportsCard(){
  clearInterval(S.sportsTimer);
  const card=$("sportsCard");
  if(card) card.classList.remove("show");
  document.body.classList.remove("sports-open");
}
// Called from the command router BEFORE the brain fallback. Returns true if handled.
async function handleSports(q){
  if(!sportsIntent(q)) return false;
  const query=extractTeam(q);
  if(!query) return false;
  setSubtitle("Checking the score…");
  const m=await findGame(query);
  if(!m) return false; // let the brain answer instead
  openSportsCard(m);
  speak(sportsSpeech(m));
  return true;
}

// she shows the words exactly when she starts saying them — never before.
// opts: {onDone, chat:false} — chat:false shows only the subtitle (no transcript line)
// ---- conversation memory: what was just said (this session) ----
function pushHist(w,t){ t=String(t||"").replace(/\s+/g," ").trim().slice(0,150); if(!t) return; S.hist=S.hist||[]; S.hist.push({w:w,t:t}); while(S.hist.length>6) S.hist.shift(); }
function histPrompt(){
  if(!S.hist||!S.hist.length) return "";
  return "Recent conversation (you are "+S.aiName+"):\n"+S.hist.map(h=>((h.w==="ai"?"You":(S.name||"User"))+": "+h.t)).join("\n")+"\n\n";
}
function speak(text,opts){
  text=String(text||""); if(!text.trim()) return;
  if(!(opts&&opts.hist===false)) pushHist("ai",text);
  opts=opts||{};
  let shown=false;
  function show(){
    if(shown) return; shown=true;
    setSubtitle(text);
    if(opts.chat!==false) addMsg("luna",text);
  }
  if(S.muted){ show(); utter(text,opts.onDone); return; }
  utter(text,opts.onDone,show);
}

}

// ---------- speech recognition ----------
const WAKE_RE=/\b(?:hey\s+)?grace\b/i;
// heard while she's mid-sentence → stop talking immediately ("hey luna", "stop", "shhh")
const INTERRUPT_RE=/\b(?:hey\s+)?grace\b|\bgrace\s+stop\b|\bstop\b|\bstop talking\b|\bsh+u*t+\s*up\b|\bquiet\b/i;
function startListening(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){ setStatus(false,"NO SPEECH SUPPORT"); speak("Speech recognition isn't supported in this browser."); return; }
  if(S.listening) return;
  const r=new R(); S.recog=r;
  r.continuous=true; r.interimResults=true; r.lang="en-US"; r.maxAlternatives=1;
  r.onresult=(e)=>{
    if(S.listening && !S.micOn) return; // mic soft-muted: stream stays alive, input ignored
    let finals="", interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) finals+=t+" "; else interim+=t+" ";
    }
    const heard=(finals+" "+interim).trim();
    // INTERRUPT: "hey luna" / "luna stop" / "stop" while she's talking stops her cold
    if(heard && (speechSynthesis.speaking||netAudioEl) && INTERRUPT_RE.test(heard)){
      try{ speechSynthesis.cancel(); }catch(err){} stopNetAudio();
      speakToken++; // drop anything queued so nothing restarts after the stop
      clearInterval(S.resumeTimer); clearTimeout(S.speechWatch);
      cancelGen(); // if she was generating too, tell the job to stop
      S.orbMode="idle"; S.buffer=""; cmdBuf="";
      clearTimeout(S.promptRestoreT); showPrompt(); // she's been stopped: prompt comes back
      // a stop word ("stop", "luna stop", "shut up") always means silence —
      // even when her name is in there too
      if(!/\bstop\b|\bsh+u*t+\s*up\b|\bquiet\b/i.test(heard)&&WAKE_RE.test(heard)){
        S.hist=[]; // fresh "hey <name>": new topic, forget the last one
        // "hey luna" while she's talking: stop cold, then just ding and listen — no voice reply
        const hadMail=!!(S.mail&&S.mail.open);
        if(hadMail){ closeMail(); S.mail=null; addMsg("luna","Email scrapped."); }
        S.awaiting=true;
        chime();
        setTimeout(()=>{ if(S.awaiting){ S.awaiting=false; S.orbMode="idle"; S.buffer=""; } },9000);
        S.ignoreUntil=Date.now()+1600;
      }else{
        // plain "stop": just go quiet, leave the 2s follow-up window open
        S.awaiting=false;
        S.followUpUntil=Date.now()+2000;
        pokeDock();
      }
      return;
    }
    if(Date.now()<S.ignoreUntil) return;
    if(finals) S.buffer+=finals;
    routeHeard(finals,interim);
  };
  r.onerror=(e)=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      // iOS fires this transiently when the mic is momentarily busy (e.g. right
      // after she finished talking). Retry a few times before giving up.
      S.micRetries=(S.micRetries||0)+1;
      if(S.micRetries<=3){ setTimeout(()=>{ if(S.listening){ try{ S.recog.start(); }catch(_){} } },800); return; }
      S.micRetries=0;
      stopListening(); setStatus(false,"MIC BLOCKED");
      speak("Microphone access was blocked. Allow the microphone, then press the mic button.");
    }else if(e.error==="audio-capture"){ stopListening(); setStatus(false,"NO MICROPHONE"); }
  };
  r.onstart=()=>{ S.micRetries=0; };
  r.onspeechstart=()=>{ hidePrompt(); clearTimeout(S.promptRestoreT); };
  r.onspeechend=()=>{
    // user stopped, but she may be about to answer: stay hidden until her
    // utterance ends (fin() restores). Fallback timer covers silent turns
    // (e.g. "open YouTube") where she never speaks.
    clearTimeout(S.promptRestoreT);
    S.promptRestoreT=setTimeout(()=>{ showPrompt(); },7000);
  };
  r.onend=()=>{
    if(!S.listening) return;
    // debounce restarts so a failing start() can't spin into a prompt loop —
    // but a restart is ALWAYS eventually scheduled, so the mic never dies silently
    const now=Date.now();
    if(now-S.lastRestart<2000){
      clearTimeout(S.restartT);
      S.restartT=setTimeout(()=>{ if(S.listening){ S.lastRestart=Date.now(); try{ S.recog.start(); }catch(e){} } }, 2000-(now-S.lastRestart)+50);
      return;
    }
    S.lastRestart=now;
    try{ r.start(); }catch(err){ setTimeout(()=>{ if(S.listening){ try{S.recog.start();}catch(e2){} } },400); }
  };
  try{
    r.start();
    S.listening=true; S.micOn=true; S.awaiting=false; S.buffer="";
    btnMic.classList.add("live"); btnMic.textContent="⏹";
    $("permMicVal").textContent="On";
    setStatus(true,'LISTENING — SAY "GRACE"');
    requestWakeLock();
  }catch(e){ setStatus(false,"MIC ERROR"); }
}
// mic button = soft toggle. One getUserMedia stream is held for the whole page
// session (a single permission grant); after that the button just mutes/unmutes
// input and speech recognition rides on the already-granted mic.

// ---- iOS/iPadOS hardening (2026-09-21): the iPad's mic/audio rules differ from desktop ----
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const SILENT_WAV="data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
let ttsAudio=null, audioUnlocked=false;
function unlockAudio(){
  // MUST run inside a real user tap: plays a silent blip so the iPad allows
  // sound later, and warms up speechSynthesis so it isn't silent either.
  if(audioUnlocked) return; audioUnlocked=true;
  try{ ttsAudio=new Audio(SILENT_WAV); const p=ttsAudio.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
  try{ const C=window.AudioContext||window.webkitAudioContext;
       if(C){ const ctx=new C(); if(ctx.state==="suspended")ctx.resume(); unlockAudio.ctx=ctx; } }catch(e){}
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){}
}

async function ensureMicStream(){
  if(IS_IOS) return true; // iPad/iPhone: speech recognition owns the mic; a held gUM stream fights it and re-prompts
  if(S.micStream) return true;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return true;
    S.micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    return true;
  }catch(e){
    setStatus(false,"MIC BLOCKED");
    speak("Microphone access was blocked. Click the lock icon in the address bar, allow the microphone, then press the mic button.");
    return false;
  }
}
async function toggleMic(){
  pokeDock();
  if(!S.listening){
    if(S.micStarting) return; // a permission prompt is already up: never stack another
    S.micStarting=true;
    try{
      const ok=await ensureMicStream();
      if(ok) startListening();
    }finally{ S.micStarting=false; }
    return;
  }
  S.micOn=!S.micOn;
  btnMic.classList.toggle("live",S.micOn);
  btnMic.textContent=S.micOn?"⏹":"🎤";
  $("permMicVal").textContent=S.micOn?"On":"Off";
  if(S.micOn) setStatus(true,'LISTENING — SAY "GRACE"');
  else{ setStatus(false,"MIC PAUSED — TAP 🎤 TO RESUME"); S.orbMode="idle"; S.awaiting=false; cmdBuf=""; }
}
function stopListening(){
  S.listening=false; S.awaiting=false; S.micOn=false;
  try{ if(S.recog) S.recog.stop(); }catch(e){}
  if(S.wakeLock){ try{S.wakeLock.release();}catch(e){} S.wakeLock=null; }
  btnMic.classList.remove("live"); btnMic.textContent="🎤";
  $("permMicVal").textContent="Off";
  setStatus(false,"NOT LISTENING");
  S.orbMode="idle";
  clearTimeout(S.promptRestoreT); showPrompt();
}
function routeHeard(finals,interim){
  const text=(finals+" "+interim).trim();
  if(!text) return;
  // still assembling a command? keep gathering until ~1.1s of silence
  if(S.awaiting||cmdBuf){
    if(finals.trim()) queueCommand(finals.trim());
    else if(interim.trim()) pokeCmdTimer();
    return;
  }
  const m=text.match(WAKE_RE);
  // while she's generating anything, she's deaf to everything except her name —
  // background chatter is dropped entirely, never buffered, never run
  if(generating()&&!m) return;
  if(m) cancelGen(); // her name breaks through: tell any long job to stop quietly
  const emailHot=!!(S.mail&&S.mail.open);
  const inFollowUp=Date.now()<S.followUpUntil||(emailHot&&!aiSpeaking());
  if(m&&!inFollowUp) S.hist=[]; // "hey <name>" out of the blue: new topic, forget the last one
  if(!m&&!inFollowUp){
    // she just acted but you're still talking: don't drop the rest — hear it as a new command
    if(Date.now()<(S.recentCmdUntil||0)&&text.replace(/[.,!?…\s]/g,"").length>1){ queueCommand(text); return; }
    return;
  }
  // email exit hatch: while the composer is open, "hey luna" (or "luna, ...")
  // forgets the email; anything after it becomes a normal command
  if(emailHot){
    const em=text.match(EMAIL_EXIT_RE);
    if(em){
      const rest=text.slice(em.index+em[0].length).trim().replace(/^[.,!?…\s]+/,"");
      closeMail(); S.mail=null; S.buffer=""; cmdBuf="";
      S.orbMode="heard"; chime(); pokeDock();
      if(rest){ queueCommand(rest); }
      else{
        // "hey luna" with the composer open: scrap it, ding, and listen — no voice reply
        addMsg("luna","Email scrapped.");
        S.awaiting=true;
        setTimeout(()=>{ if(S.awaiting){ S.awaiting=false; S.orbMode="idle"; S.buffer=""; } },9000);
        S.ignoreUntil=Date.now()+1400;
      }
      return;
    }
  }
  // wake word heard inside the follow-up window: refresh the window
  if(m) S.followUpUntil=Date.now()+2000;
  const after=m?text.slice(m.index+m[0].length).trim():text;
  S.orbMode="heard"; chime(); pokeDock();
  if(after.replace(/[.,!?…\s]/g,"").length>1){ queueCommand(after); }
  else{
    // wake word alone: just ding and listen — no voice reply
    S.awaiting=true; cmdBuf="";
    setTimeout(()=>{ if(S.awaiting){ S.awaiting=false; S.orbMode="idle"; S.buffer=""; } },9000);
    S.ignoreUntil=Date.now()+1400;
  }
  S.buffer="";
}
// wait for a real pause before acting, so she hears the whole sentence
let cmdBuf="", cmdTimer=null;
function pokeCmdTimer(){
  clearTimeout(cmdTimer);
  // she listens until you actually stop talking: every new word restarts the
  // silence timer, and she only acts after a real ~2.5s pause
  cmdTimer=setTimeout(()=>{
    const c=cmdBuf.trim(); cmdBuf=""; S.awaiting=false;
    // just-handled window: if you're still talking, the rest gets heard too
    S.recentCmdUntil=Date.now()+5000;
    if(c) handleCommand(c);
  },2500);
}
function queueCommand(t){ cmdBuf=(cmdBuf+" "+t).trim(); pokeCmdTimer(); }
</script>

<script>
"use strict";
/* ---------------- command router ---------------- */
// strip pet names / filler people tack onto commands ("dear", "doll", "be a doll and ...")
// so the router sees the actual task
function stripFiller(t){
  let s=t;
  s=s.replace(/^(?:be a (?:good )?(?:doll|dear|sweetie|sweetheart|honey|darling|angel|dearie)\s+and\s+|(?:doll|dear|sweetie|sweetheart|honey|darling|dearie)[,]\s*|(?:please[,.]?|(?:could|would|can|will) you)\s+)+/i,"");
  let prev;
  do{ prev=s; s=s.replace(/[,.]?\s+(?:for me(?: please)?|please|my (?:doll|dear|sweetie|sweetheart|honey|darling|dearie)|(?:doll|dear|sweetie|sweetheart|honey|darling|dearie))$/i,""); }while(s!==prev);
  return s.trim();
}
function handleCommand(raw){
  const text=stripFiller(raw.trim().replace(/\s+/g," "));
  if(!text) return;
  addMsg("you",text);
  pushHist("user",text); // every request recorded once, here — handlers must not re-push
  S.lastCmd=text;
  S.orbMode="thinking";
  const tl=text.toLowerCase();
  closeDoc(); // the writer window stays up only until the next command
  // answering a concierge question ("where? / when? / budget?") — not a new command
  if(S.flow&&S.flow.awaiting){
    (async ()=>{ try{ await answerFlowSlot(text); }catch(e){ S.flow=null; speak("Let's drop that — what do you need?"); } S.orbMode="idle"; })();
    return;
  }
  // email composer is open: sticky context — everything said is about the email
  // ("hey luna" is the only exit hatch; a fresh "send an email" starts over)
  if(S.mail&&S.mail.open){
    (async ()=>{
      try{
        if(await tryMailComposer(tl,text)){ /* fresh composer started */ }
        else if(S.mail&&S.mail.awaiting){ await answerMailSlot(text); }
        else if(S.mail){ await emailContext(text); }
      }catch(e){ S.mail=null; closeMail(); speak("Email dropped."); }
      S.orbMode="idle";
    })();
    return;
  }
  (async ()=>{
    try{
      if(await tryGuardrails(tl,text)) return done();
      if(await trySystem(tl,text)) return done();
      if(await tryMessage(tl,text)) return done();
      if(await tryGraceMedia(tl,text)) return done();
      if(await tryGraceLists(tl,text)) return done();
      if(await tryNotes(tl,text)) return done();
      if(await tryGraceRecipe(tl,text)) return done();
      if(await tryMemory(tl,text)) return done();
      if(await tryJokes(tl,text)) return done();
      if(await tryPersonality(tl,text)) return done();
      if(await tryOpinions(tl,text)) return done();
      if(await tryFiles(tl,text)) return done();
      if(await tryMailComposer(tl,text)) return done();
      if(await tryEmail(tl,text)) return done();
      if(await runGen(()=>tryWriter(tl,text))) return done();
      if(await tryTimeDate(tl)) return done();
      if(await tryTimer(tl,text)) return done();
      if(await tryCalc(tl,text)) return done();
      if(await tryWeather(tl,text)) return done();
      if(await tryDevice(tl,text)) return done();
      if(await tryFileSearch(tl)) return done();
      if(await tryConcierge(tl,text)) return done();
      if(await runGen(()=>tryBriefing(tl,text))) return done();
      if(await runGen(()=>tryTeach(tl,text))) return done();
      if(await runGen(()=>tryWildcard(tl,text))) return done();
      if(await tryWeb(tl,text)) return done();
      if(await trySlang(tl,text)) return done();
      if(await runGen(()=>tryWiki(tl,text))) return done();
      if(await handleSports(text)) return done();
      await tryBrain(tl,text);
    }catch(e){ loadFail(); }
    function done(){ S.orbMode="idle"; }
  })();
}
function needWeb(){
  if(!S.webAccess){ speak("Web access is turned off. Flip it on in Settings under Permissions."); return false; }
  return true;
}

/* ---------------- system ---------------- */
/* ---------------- live jokes: quick internet search, spoken directly (no window) ---------------- */
const JOKE_FALLBACK="My joke book seems to be stuck shut at the moment. Ask me again in a second and I will have one ready.";
const JOKE_ALIAS={british:"england",uk:"england",english:"england",american:"america"};
function jokeTopic(tl){
  let m=tl.match(/\bjokes?\b\s+about\s+([a-z]+(?:\s+[a-z]+)?)/)
       ||tl.match(/(?:tell|give|say|got|know|hear|want|need)\s+(?:me\s+)?(?:a|an|another|some|any)?\s*([a-z]+(?:\s+[a-z]+)?)\s*jokes?\b/)
       ||tl.match(/^\s*([a-z]+(?:\s+[a-z]+)?)\s+jokes?\b/);
  let t=m?m[1].trim():"";
  if(/^(a|an|the|some|any|another|funny|good|great|best|new|clean|nice|silly)$/.test(t)) t="";
  return JOKE_ALIAS[t]||t;
}
async function fetchJoke(topic){
  let url="https://v2.jokeapi.dev/joke/Any?blacklistFlags=nsfw,religious,political,racist,sexist,explicit";
  if(topic) url+="&contains="+encodeURIComponent(topic);
  const r=await fetch(url);
  if(!r.ok) return null;
  const j=await r.json();
  if(j.error) return null;
  if(j.type==="single"&&j.joke) return j.joke;
  if(j.type==="twopart"&&j.setup&&j.delivery) return j.setup+" "+j.delivery;
  return null;
}
async function tryJokes(tl,text){
  if(!/(\bjokes?\b|make me laugh|something funny)/.test(tl)) return false;
  if(!needWeb()) return true;
  let joke=null;
  try{
    const topic=jokeTopic(tl);
    joke=await fetchJoke(topic);
    if(!joke&&topic) joke=await fetchJoke("");
  }catch(e){}
  if(!joke) joke=JOKE_FALLBACK;
  speak(joke);
  return true;
}

const JOKES=[
 "Why do programmers prefer dark mode? Because light attracts bugs.",
 "I told my computer I needed a break, and now it won't stop sending me KitKat ads.",
 "Why did the iPad go to therapy? Too many tabs open.",
 "There are only 10 kinds of people: those who understand binary and those who don't.",
 "Why don't scientists trust atoms? Because they make up everything.",
 "I would tell you a UDP joke, but you might not get it.",

async function trySystem(tl,text){
  // casual greetings FIRST — never let "what's up" fall through to a dictionary definition
  if(/^(what'?s up|whats up|wassup|wazzup|whaddup|sup|yo|hiya|howdy|hey+)\b/.test(tl)&&tl.length<30){
    const g=[
      "Not much — what's good with you?",

    setSubtitle("Voice muted.");

  }
  if(/\bunmute\b/.test(tl)){

  }
  if(/^(help|what can you do|commands)$/.test(tl)||tl.includes("what can you do")){
    speak("Here's what I can do, hon. Just say Grace, then ask. I can find recipes and read them to you step by step, set baking timers, and keep your saved recipes. I can check sports scores, look things up and explain them, find and play YouTube videos and songs, check the weather, do math, keep lists and notes, and remember things for you. I can write letters and guides in a side window, draft emails, read you the news, and teach you about anything. I can also help you shop — I'll show you options with links to the store websites. If I ever misunderstand, just say it a different way.");
    return true;
  }
  if(/\bjoke\b/.test(tl)){ speak(JOKES[Math.floor(Math.random()*JOKES.length)]); return true; }
  if(/^(hi|hello|hey|yo|sup|good (morning|afternoon|evening))\b/.test(tl)&&tl.length<26){
    speak(S.name?("Hey "+S.name+"! What do you need?"):"Hey! What do you need?");
    return true;
  }
  if(/how are you/.test(tl)){ speak("Running smooth and fully charged with curiosity. How can I help?"); return true; }
  if(/thank/.test(tl)){ speak("Anytime."); return true; }
  if(/^(bye|goodbye|good ?night|see you)/.test(tl)){ speak("Later! I'll be right here when you need me."); return true; }
  if(/repeat/.test(tl)&&/that|it|say/.test(tl)){ if(S.lastSpoken) speak(S.lastSpoken); else speak("I haven't said anything yet."); return true; }
  if(/my name is (.+)/.test(tl)){
    const n=text.match(/my name is (.+)/i)[1].trim().replace(/[.!?]$/,"");
    S.name=n.charAt(0).toUpperCase()+n.slice(1); store.set("name",S.name);
    speak("Got it, "+S.name+". Nice to meet you.");
    return true;
  }
  if(/what('| i)s my name/.test(tl)){ speak(S.name?("You're "+S.name+"."):("You haven't told me your name yet. Say 'my name is' and then your name.")); return true; }
  if(/who are you|your name/.test(tl)){ speak("I'm Grace, your voice helper. I live right here on your iPad."); return true; }
  if(/^(stop|quiet)$/.test(tl)){ stopListening(); speak("Stopped listening. Press the mic button when you want me back."); return true; }
  return false;
}
function updateMuteBtn(){ btnMute.textContent=S.muted?"🔇":"🔊"; }

/* ---------------- memories (notes were merged in here) ---------------- */
async function tryNotes(tl,text){
  let m=tl.match(/(?:take a note|note|remember)(?: that| to)?\s*[:\-]?\s*(.+)/);
  if(m&&m[1]&&!/^(?:me to|to remind)/.test(m[1])&&!/this about me/.test(m[1])){
    const note=text.match(/(?:take a note|note|remember)(?: that| to)?\s*[:\-]?\s*(.+)/i)[1].trim();
    addMemory(note);
    speak("I'll remember that."); return true;
  }
  if(/read( me)? my notes|list( my)? notes|what are my notes|my notes/.test(tl)){
    if(!S.memories.length){ speak("You have no memories saved yet. Say 'remember' followed by what you want me to keep."); }
    else speak("Here's what I remember: "+S.memories.map((n,i)=>(i+1)+". "+n).join(" "));
    return true;
  }
  if(/delete|clear/.test(tl)&&/notes?|memories|memory/.test(tl)){
    S.memories=[]; store.set("memories",S.memories); renderMemories();
    speak("All memories cleared."); return true;
  }
  return false;
}

/* ---------------- memories ---------------- */
function renderMemories(){
  const box=$("memList"); box.innerHTML="";
  if(!S.memories.length){ box.innerHTML='<div class="empty">Nothing saved yet.</div>'; return; }
  const wrap=document.createElement("div"); wrap.className="chiprow";
  S.memories.forEach((mem,i)=>{
    const c=document.createElement("div"); c.className="chip";
    const s=document.createElement("span"); s.textContent="🧠 "+mem; c.appendChild(s);
    const b=document.createElement("button"); b.textContent="✕"; b.title="Forget this";
    b.onclick=()=>{ S.memories.splice(i,1); store.set("memories",S.memories); renderMemories(); };
    c.appendChild(b); wrap.appendChild(c);
  });
  box.appendChild(wrap);
}
function addMemory(t){
  t=t.trim().replace(/[.!?]$/,""); if(!t) return;
  S.memories.push(t); store.set("memories",S.memories); renderMemories();
}
async function tryMemory(tl,text){
  let m=tl.match(/(?:remember this about me|add (?:a )?memory)[:\s]+(.+)/);
  if(m){
    const mem=text.match(/(?:remember this about me|add (?:a )?memory)[:\s]+(.+)/i)[1].trim();
    addMemory(mem);
    speak("I'll remember that."); return true;
  }
  if(/what do you remember( about me)?/.test(tl)){
    if(!S.memories.length) speak("I don't have any memories saved yet. Say 'remember this about me' followed by what you want me to keep.");
    else speak("Here's what I remember about you: "+S.memories.map((x,i)=>(i+1)+". "+x).join(" "));
    return true;
  }
  m=tl.match(/forget (?:that )?(.+)/);
  if(m){
    const q=m[1].trim().toLowerCase();
    const i=S.memories.findIndex(x=>x.toLowerCase().includes(q));
    if(i>=0){ const gone=S.memories.splice(i,1)[0]; store.set("memories",S.memories); renderMemories(); speak("Forgot: "+gone+"."); }
    else speak("I couldn't find a memory matching that.");
    return true;
  }
  return false;
}

/* ---------------- time & date ---------------- */
async function tryTimeDate(tl){
  const now=new Date();
  if(/what('| i)s the time|tell me the time|^time$/.test(tl)){
    speak("It's "+now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+".");
    return true;
  }
  if(/what('| i)s the date|what day is|today('| i)s date|^date$/.test(tl)){
    speak("Today is "+now.toLocaleDateString([],{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".");
    return true;
  }
  return false;
}

/* ---------------- timers ---------------- */
function renderTimers(){
  const box=$("timerList"); box.innerHTML="";
  if(!S.timers.length){ box.innerHTML='<div class="empty">No active timers.</div>'; return; }
  const wrap=document.createElement("div"); wrap.className="chiprow";
  S.timers.forEach(t=>wrap.appendChild(t.el));
  box.appendChild(wrap);
}
function addTimer(ms,label,fireMsg){
  const el=document.createElement("div"); el.className="chip";
  const s=document.createElement("span"); el.appendChild(s);
  const end=Date.now()+ms;
  const rec={el:el};
  const id=setInterval(()=>{
    const left=Math.max(0,end-Date.now());
    s.textContent="⏱ "+label+" — "+fmtDur(left);
    if(left<=0){
      clearInterval(id); el.remove();
      S.timers=S.timers.filter(t=>t!==rec); renderTimers();
      beep(660,0.4,0); beep(660,0.4,0.5);
      const msg=fireMsg||label+" — time's up!";
      setSubtitle("⏱ "+msg); speak(msg);
    }
  },1000);
  s.textContent="⏱ "+label+" — "+fmtDur(ms);
  const b=document.createElement("button"); b.textContent="✕"; b.title="Cancel";
  b.onclick=()=>{ clearInterval(id); el.remove(); S.timers=S.timers.filter(t=>t!==rec); renderTimers(); };
  el.appendChild(b);
  rec.cancel=()=>{clearInterval(id);};
  S.timers.push(rec); renderTimers();
}
function fmtDur(ms){
  const s=Math.round(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  return (h?h+"h ":"")+(m?m+"m ":"")+ss+"s";
}
async function tryTimer(tl,text){
  if(!/(?:set )?(?:a )?timer|alarm/.test(tl)) return false;
  const n=tl.match(/(\d+)\s*(second|minute|hour)/);
  if(!n){ speak("For how long? Say something like: set a timer for 5 minutes."); return true; }
  const ms=parseInt(n[1],10)*(n[2].startsWith("hour")?3600000:n[2].startsWith("minute")?60000:1000);
  const baking=!!(S.recipeSteps&&S.recipeSteps.length);
  addTimer(ms,baking?"Baking timer":"Timer",baking?"Your timer is done!":null);
  speak((baking?"Baking timer":"Timer")+" set for "+n[1]+" "+n[2]+(parseInt(n[1],10)>1?"s":"")+", hon.");
  return true;
}

/* ---------------- grace: recipes, baking timers, saved recipes ---------------- */
function getGraceRecipes(){ try{ return JSON.parse(localStorage.getItem("grace_recipes")||"[]"); }catch(e){ return []; } }
function setGraceRecipes(r){ try{ localStorage.setItem("grace_recipes",JSON.stringify(r.slice(0,30))); }catch(e){} }
function parseRecipeSteps(raw){
  const steps=[];
  for(const ln of String(raw||"").split(/\r?\n/)){
    const m=ln.match(/^\s*(?:\d+[.)]\s*|[-*\u2022]\s*)(.+?)\s*$/);
    if(m&&m[1]&&m[1].length>1) steps.push(m[1].trim());
  }
  return steps.slice(0,20);
}
function recipeCard(){
  const steps=S.recipeSteps||[];
  let h="<b>"+esc(S.recipeName||"Recipe")+"</b> — say <b>next step</b>, <b>previous step</b>, or <b>repeat that step</b>.<ol>";
  steps.forEach((s,i)=>{ h+="<li"+(i===S.recipeIdx?" style='font-weight:800;color:var(--gold-deep)'":"")+">"+esc(s)+"</li>"; });
  addMsg("luna","",h+"</ol>");
}
function recipeSay(){
  const steps=S.recipeSteps||[];
  if(!steps.length) return;
  S.recipeIdx=Math.max(0,Math.min(S.recipeIdx,steps.length-1));
  recipeCard();
  speak("Step "+(S.recipeIdx+1)+" of "+steps.length+": "+steps[S.recipeIdx]);
}
async function tryGraceRecipe(tl,text){
  // cancel a running timer
  if(/\bcancel( the| my)? timers?\b/.test(tl)){
    if(S.timers&&S.timers.length){
      S.timers.forEach(t=>{ try{ t.cancel(); }catch(e){} if(t.el) t.el.remove(); });
      S.timers=[]; renderTimers();
      speak("Timer cancelled, hon.");
    }else speak("There's no timer running.");
    return true;
  }
  // save the open recipe
  if(/\bsave this recipe\b/.test(tl)){
    if(!S.recipeSteps||!S.recipeSteps.length){ speak("There's no recipe open to save. Find a recipe first, then say save this recipe."); return true; }
    const saved=getGraceRecipes(), name=(S.recipeName||"Recipe");
    const ix=saved.findIndex(r=>String(r.name).toLowerCase()===name.toLowerCase());
    const rec={name:name,steps:S.recipeSteps};
    if(ix>=0) saved[ix]=rec; else saved.push(rec);
    setGraceRecipes(saved);
    speak("Saved "+name+" to your recipes, hon."); return true;
  }
  // list saved recipes
  if(/\bmy recipes\b|\bshow( me)? (my )?recipes\b|\blist( my)? recipes\b/.test(tl)){
    const saved=getGraceRecipes();
    if(!saved.length) speak("You haven't saved any recipes yet. Find a recipe and say save this recipe.");
    else speak("Your saved recipes: "+saved.map(r=>r.name).join(", ")+". Say open recipe, then the name.");
    return true;
  }
  // open a saved recipe
  let m=tl.match(/\bopen recipe (.+)/);
  if(m){
    const want=m[1].trim().replace(/[.?!,]+$/,"");
    const rec=getGraceRecipes().find(r=>{ const n=String(r.name).toLowerCase(); return n===want||n.includes(want)||want.includes(n); });
    if(!rec||!rec.steps||!rec.steps.length){ speak("I couldn't find a saved recipe called "+want+"."); return true; }
    S.recipeName=rec.name; S.recipeSteps=rec.steps.slice(); S.recipeIdx=0;
    openDoc("🍰 "+S.recipeName, mdLite(S.recipeSteps.map((s,i)=>(i+1)+". "+s).join("\n")), S.recipeSteps.map((s,i)=>(i+1)+". "+s).join("\n"));
    recipeSay(); return true;
  }
  // step navigation while a recipe is open
  if(S.recipeSteps&&S.recipeSteps.length&&!/recipe/.test(tl)){
    if(/\bnext step\b|\bcontinue\b/.test(tl)){ S.recipeIdx=Math.min(S.recipeIdx+1,S.recipeSteps.length-1); recipeSay(); return true; }
    if(/\b(previous step|last step|go back)\b/.test(tl)){ S.recipeIdx=Math.max(S.recipeIdx-1,0); recipeSay(); return true; }
    if(/\brepeat\b/.test(tl)){ recipeSay(); return true; }
  }
  // find a new recipe
  m=tl.match(/(?:find|get|look up|show me|looking for|tell me)(?: me)? a (.+?) recipe\b/)||tl.match(/\brecipe for (.+)/)||tl.match(/(.+?) recipe$/);
  if(!m) return false;
  // never let the wake word or filler verbs leak into the dish name
  const dish=m[1].trim().replace(/[.?!,]+$/,"").replace(/^(?:hey\s+)?grace\s+/i,"")
    .replace(/^(?:please\s+|tell\s+me\s+(?:a\s+)?|looking\s+for\s+(?:a\s+)?|find\s+(?:me\s+)?(?:a\s+)?|get\s+(?:me\s+)?(?:a\s+)?|show\s+me\s+(?:a\s+)?|look\s+up\s+(?:a\s+)?)/i,"").trim();
  if(!dish||dish.length<2) return false;
  if(!needWeb()) return true;
  setSubtitle("Finding a "+dish+" recipe…"); S.orbMode="thinking";
  try{
    const raw=await brainRaw(
      "Give a simple home recipe for "+dish.slice(0,80)+". Reply with ONLY numbered steps, one per line like \"1. ...\". No title, no intro, no outro, no ingredient list, at most 10 steps.",
      "You are a recipe writer. Output only numbered steps, one per line.", 25000);
    const steps=parseRecipeSteps(raw);
    if(!steps.length) throw 0;
    S.recipeName=dish.replace(/\w\S*/g,w=>w.charAt(0).toUpperCase()+w.slice(1));
    S.recipeSteps=steps; S.recipeIdx=0;
    openDoc("🍰 "+S.recipeName, mdLite(steps.map((s,i)=>(i+1)+". "+s).join("\n")), steps.map((s,i)=>(i+1)+". "+s).join("\n"));
    speak("Here's "+S.recipeName+", hon \u2014 the full list is in the window, and I'll walk you through it. Say save this recipe if you'd like to keep it.");
    recipeSay();
  }catch(e){ S.orbMode="idle"; speak("I couldn't pull up a recipe for that just now. Try asking again."); }
  return true;
}

/* ---------------- calculator ---------------- */
async function tryCalc(tl,text){
  let expr=tl.replace(/^calculate\s*/,"").replace(/^what('| i)s\s*/,"").replace(/\?$/,"");
  const words={plus:"+",minus:"-",times:"*",multiplied:"*",divide:"/",divided:"/",over:"/",percent:"%",to:"",by:"",and:"",what:"",is:"",the:"",equals:"=",x:"*",X:"*","×":"*","÷":"/"};
  expr=expr.split(/\s+/).map(w=>words[w]!==undefined?words[w]:w).join(" ");
  expr=expr.replace(/(\d)\s*%\s*of\s*(\d)/g,"($1/100*$2)");
  expr=expr.replace(/square root of (\d+(\.\d+)?)/g,"sqrt($1)");
  expr=expr.replace(/sqrt\(/g,"Math.sqrt(");
  if(!/^[\d\s+\-*/().%^]+$/.test(expr)) return false;
  if(!/[\d]/.test(expr)||!/[-+*/%^]/.test(expr)) return false;
  try{
    const val=Function('"use strict"; return ('+expr.replace(/\^/g,"**")+")")();
    if(typeof val!=="number"||!isFinite(val)) return false;
    speak("That's "+(Math.round(val*1000000)/1000000)+".");
    return true;
  }catch(e){ return false; }
}

/* ---------------- weather ---------------- */
async function geocode(place){
  const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(place)+"&count=1&language=en&format=json");
  const j=await r.json();
  if(j.results&&j.results.length) return {name:j.results[0].name+", "+(j.results[0].country||""), lat:j.results[0].latitude, lon:j.results[0].longitude};
  return null;
}
const WMO={0:"clear sky",1:"mainly clear",2:"partly cloudy",3:"overcast",45:"foggy",48:"icy fog",51:"light drizzle",53:"drizzle",55:"heavy drizzle",61:"light rain",63:"rain",65:"heavy rain",71:"light snow",73:"snow",75:"heavy snow",80:"light showers",81:"showers",82:"heavy showers",95:"thunderstorms",96:"storm with hail",99:"storm with hail"};
async function fetchWeather(lat,lon,name){
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=2");
  const j=await r.json();
  const c=j.current, d=j.daily;
  const cond=WMO[c.weather_code]||"changing conditions";
  const temp=Math.round(c.temperature_2m), high=Math.round(d.temperature_2m_max[0]), low=Math.round(d.temperature_2m_min[0]);
  const rain=(d.precipitation_probability_max[0]??0);
  const emoji=/clear/.test(cond)?"\u2600\uFE0F":/partly/.test(cond)?"\u26C5":/overcast/.test(cond)?"\u2601\uFE0F":/fog/.test(cond)?"\uD83C\uDF2B\uFE0F":/drizzle|rain|shower/.test(cond)?"\uD83C\uDF27\uFE0F":/snow/.test(cond)?"\u2744\uFE0F":/thunder|storm/.test(cond)?"\u26C8\uFE0F":"\uD83C\uDF24\uFE0F";
  try{ openMini("Weather in "+name,
    '<div style="text-align:center;padding:6px">'+
    '<div style="font-size:54px;line-height:1.2">'+emoji+'</div>'+
    '<div style="font-size:46px;font-weight:700;margin:2px 0">'+temp+'°F</div>'+
    '<div style="font-size:18px;opacity:.85;text-transform:capitalize">'+cond+'</div>'+
    '<div style="margin-top:10px;font-size:15px;opacity:.7">High '+high+'°F &middot; Low '+low+'°F &middot; Rain '+rain+'%</div>'+
    '</div>',true); }catch(e){}
  return "In "+name+" it's "+temp+"°F and "+cond+", humidity "+c.relative_humidity_2m+"%, wind "+Math.round(c.wind_speed_10m)+" mph. "+
    "Today's high "+high+", low "+low+
    ", rain chance "+rain+"%. Tomorrow: high "+Math.round(d.temperature_2m_max[1])+", low "+Math.round(d.temperature_2m_min[1])+".";
}
async function tryWeather(tl,text){
  if(!/weather/.test(tl)) return false;
  if(!needWeb()) return true;
  let m=tl.match(/weather in (.+)/);
  if(m){
    const place=m[1].trim();
    speak("Looking up the weather in "+place+"…",{hist:false});
    try{
      const g=await geocode(place);
      if(!g){ speak("I couldn't find "+place+". Try another city name."); return true; }
      speak(await fetchWeather(g.lat,g.lon,g.name));
    }catch(e){ loadFail(); }
    return true;
  }
  let m2=tl.match(/(?:set my location|i live in|my (?:city|location) is)\s+(?:to\s+)?(.+)/);
  if(m2){
    const place=m2[1].trim();
    try{
      const g=await geocode(place);
      if(!g){ speak("I couldn't find "+place+"."); return true; }
      S.loc=g; store.set("loc",g);
      speak("Saved. Your location is "+g.name+". Ask me for the weather anytime.");

  catch(e){ loadFail(); }
  return true;
}

/* ---------------- concierge: shopping + places to stay ---------------- */
// Detects "find me a cabin in X" / "i want to buy a laptop", asks for the
// missing budget (and trip dates for stays), then shows the best options as
// a clickable list in a mini window — tapping one opens it in a real tab.
// Follow-ups while results are showing: "cheaper", "pricier", "show more",
// "compare 1 and 2", "open number 3".
const STAY_WORDS=/\b(cabins?|hotels?|motels?|airbnbs?|vrbos?|vacation rentals?|places? to stay|lodge?s?|resorts?|bed and breakfasts?)\b/;
const BUY_HINT=/\b(buy|buying|purchase|purchasing|order)\b/;
function parseBudget(tl){
  if(/\ba\s+thousand\b|\ba\s+grand\b/.test(tl)) return 1000;
  const m=tl.match(/\$?\s*(\d[\d,]*)\s*(k|thousand|grand|dollars|bucks|usd)?\b/);
  if(!m) return null;
  let n=parseFloat(m[1].replace(/,/g,""));
  const u=(m[2]||"").toLowerCase();
  if(u==="k"||u==="thousand"||u==="grand") n*=1000;
  if(!(n>0)||n>100000000) return null;
  return Math.round(n);
}
const MONTHN={january:1,jan:1,february:2,feb:2,march:3,mar:3,april:4,apr:4,may:5,june:6,jun:6,july:7,jul:7,august:8,aug:8,september:9,sep:9,sept:9,october:10,oct:10,november:11,nov:11,december:12,dec:12};
function monthDay(mon,day){
  const now=new Date();
  let d=new Date(now.getFullYear(),mon-1,day);
  if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate())) d=new Date(now.getFullYear()+1,mon-1,day);
  return d;
}
function fmtD(d){ return d.toLocaleDateString([],{month:"short",day:"numeric"}); }
function isoD(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isoToDate(s){ const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function nextWeekday(wd){ const d=new Date(); const diff=(wd-d.getDay()+7)%7||7; d.setDate(d.getDate()+diff); return d; }
function mkRange(a,b,label){
  const nights=Math.max(1,Math.round((b-a)/864e5));
  return {checkin:isoD(a),checkout:isoD(b),label:label||(fmtD(a)+" to "+fmtD(b)),nights:nights};
}
function parseDates(tl){
  if(/\bnext weekend\b/.test(tl)){ const f=nextWeekday(5); return mkRange(f,new Date(f.getTime()+2*864e5),"next weekend"); }
  if(/\bthis weekend\b/.test(tl)){ const f=nextWeekday(5); return mkRange(f,new Date(f.getTime()+2*864e5),"this weekend"); }
  const mn="(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)";
  let m=tl.match(new RegExp(mn+"\\s+(\\d{1,2})(?:st|nd|rd|th)?\\s*(?:to|-|through|thru|till|until|\u2013)\\s*(?:"+mn+"\\s+)?(\\d{1,2})(?:st|nd|rd|th)?"));
  if(m){
    const mo1=MONTHN[m[1]], mo2=m[3]?MONTHN[m[3]]:mo1;
    if(!mo1) return null;
    const a=monthDay(mo1,parseInt(m[2],10));
    let b=monthDay(mo2||mo1,parseInt(m[4],10));
    if(b<=a) b=new Date(a.getTime()+864e5);
    return mkRange(a,b,null);
  }
  m=tl.match(new RegExp("\\b"+mn+"\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b"));
  if(m&&MONTHN[m[1]]){
    const a=monthDay(MONTHN[m[1]],parseInt(m[2],10));
    return {checkin:isoD(a),checkout:null,label:fmtD(a),nights:null};
  }
  return null;
}
function exampleDates(){
  const a=new Date(); a.setDate(a.getDate()+21);
  return fmtD(a)+" to "+fmtD(new Date(a.getTime()+3*864e5));
}
function extractDestination(tl){
  let t=tl.replace(/\b(next weekend|this weekend)\b/g," ")
    .replace(/(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\w*\s+\d{1,2}(?:st|nd|rd|th)?(\s*(?:to|-|through|thru|till|until|\u2013)\s*((january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\w*\s+)?\d{1,2}(?:st|nd|rd|th)?)?/g," ")
    .replace(/\s+for\s+(a\s+|the\s+|my\s+)?(trip|vacation|weekend|stay|honeymoon|getaway).*$/," ");
  const m=t.match(/\bin\s+([a-z][a-z\s.'-]*?)\s*$/);
  if(m&&m[1].trim().length>1) return cap1(m[1].trim());
  return null;
}
function extractItem(tl){
  let m=tl.match(/(?:want|need)\s+to\s+buy\s+(?:a\s+|an\s+|me\s+)?(.+?)(?:\s+under\s+\$?[\d,k]+|\s+for\s+(?:under\s+|less than\s+)?\$?[\d,k]+|\s*$)/)
       || tl.match(/(?:find|search for|look for|show me|get me)\s+(?:me\s+)?(?:a\s+|an\s+)?(.+?)\s+to\s+buy\s*$/)
       || tl.match(/\bbuy\s+(?:me\s+)?(?:a\s+|an\s+)?(.+?)(?:\s+under\s+\$?[\d,k]+|\s+for\s+(?:under\s+|less than\s+)?\$?[\d,k]+|\s*$)/);
  if(m&&m[1].trim().length>1) return cap1(m[1].trim().replace(/\s+for\s+sale$/,""));
  return null;
}
function extractUpfrontBudget(tl){
  const m=tl.match(/(?:budget|under|less than|at most|max(?:imum)?)\s*(?:of\s*)?\$?\s*(\d[\d,]*)\s*(k|thousand|grand|dollars|bucks)?/);
  return m?parseBudget(m[0]):null;
}
// --- multi-turn slot filling: answers to "where? / when? / budget?" land here ---
async function answerFlowSlot(text){
  const tl=text.toLowerCase().trim();
  const f=S.flow; if(!f) return;
  if(/^(cancel|never ?mind|stop|forget it|nevermind|drop it|never mind)/.test(tl)){ S.flow=null; speak("No problem — dropped it."); return; }
  if(f.awaiting==="where"){
    const dest=text.trim().replace(/[?.!]+$/,"");
    if(dest.length<2){ speak("I didn't catch that — what city or area?"); return; }
    f.slots.destination=cap1(dest); flowNext(); return;
  }
  if(f.awaiting==="dates"){
    const d=parseDates(tl);
    if(!d){ speak("I didn't catch the dates — try something like "+exampleDates()+". Or say cancel."); return; }
    if(!d.checkout){ f.slots.dates=d; f.awaiting="checkout"; speak("Got it, checking in "+d.label+". What day are you checking out?"); return; }
    f.slots.dates=d; flowNext(); return;
  }
  if(f.awaiting==="checkout"){
    let out=null;
    const d=parseDates(tl);
    if(d&&d.checkin) out=d.checkin;
    else{
      const m2=tl.match(/(\d{1,2})(?:st|nd|rd|th)?/);
      if(m2){ const ci=f.slots.dates.checkin.split("-"); out=ci[0]+"-"+ci[1]+"-"+String(m2[1]).padStart(2,"0"); }
    }
    if(!out){ speak("What day are you checking out?"); return; }
    const a=f.slots.dates.checkin;
    if(out<=a){ speak("Checkout has to be after check-in — what day are you leaving?"); return; }
    f.slots.dates={checkin:a,checkout:out,label:fmtD(isoToDate(a))+" to "+fmtD(isoToDate(out)),nights:Math.round((isoToDate(out)-isoToDate(a))/864e5)};
    flowNext(); return;
  }
  if(f.awaiting==="budget"){
    const b=parseBudget(tl);
    if(!b){ speak("I didn't catch a budget — say something like '800 dollars'. Or say cancel."); return; }
    f.slots.budget=b; flowNext(); return;
  }
}
function flowNext(){
  const f=S.flow; if(!f) return;
  const s=f.slots;
  if(f.kind==="stay"){
    if(!s.destination){ f.awaiting="where"; speak("Where are you looking to stay?"); return; }
    if(!s.dates||!s.dates.checkout){ f.awaiting="dates"; speak("When's the trip? Give me the dates, like "+exampleDates()+"."); return; }
    if(!s.budget){ f.awaiting="budget"; speak("And what's your total budget for the stay?"); return; }
  }else{
    if(!s.budget){ f.awaiting="budget"; speak("What's your budget for "+s.item+"?"); return; }
  }
  runConcierge();
}
async function brainRaw(prompt,sys,ms){
  try{
    return await brainLLM7(prompt,sys,ms); // primary brain: fast keyless endpoint
  }catch(e){
    // primary down? fall back to pollinations
    const url="https://text.pollinations.ai/"+encodeURIComponent(prompt.slice(0,1400))+"?system="+encodeURIComponent(sys||"");
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),ms||18000);
    const r=await fetch(url,{signal:ctrl.signal}); clearTimeout(to);
    if(!r.ok) throw 0;
    return (await r.text()).trim();
  }
}
// primary brain: a free keyless OpenAI-compatible endpoint (fast, ~2s answers)
async function brainLLM7(prompt,sys,ms){
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),ms||25000);
  const r=await fetch("https://api.llm7.io/v1/chat/completions",{method:"POST",signal:ctrl.signal,
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"mistral-Nemo-Instruct-2407",
      messages:[{role:"system",content:sys||"You are a helpful assistant."},
                {role:"user",content:prompt.slice(0,1400)}]})});
  clearTimeout(to);
  if(!r.ok) throw 0;
  const j=await r.json();
  const t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!t||!t.trim()) throw 0;
  return t.trim();
}
// legacy alias: pollinations is now the backup brain
async function brainBackup(prompt,sys,ms){ return brainLLM7(prompt,sys,ms); }
function optionUrl(kind,name,s){
  if(kind==="stay") return "https://www.google.com/search?q="+encodeURIComponent(name+" "+(s.destination||"")+" cabin rental");
  return "https://www.google.com/search?tbm=shop&q="+encodeURIComponent(name);
}
function parseOptions(raw,kind,s){
  if(!raw) return [];
  const opts=[];
  for(const line of raw.split("\n")){
    const parts=line.split("||").map(p=>p.trim().replace(/^\d+[.)]\s*/,""));
    if(parts.length<3) continue;
    const name=parts[0].replace(/^["'“”]+|["'“”]+$/g,"");
    const priceNum=parseFloat((parts[1]||"").replace(/[^0-9.]/g,""));
    if(!name||name.length>90) continue;
    opts.push({
      name:name,
      price:isFinite(priceNum)?priceNum:null,
      priceLabel:isFinite(priceNum)?"$"+Math.round(priceNum).toLocaleString()+(kind==="stay"?"/night":""):"see listing",
      why:parts[2]||"", con:parts[3]||"",
      url:optionUrl(kind,name,s)
    });
    if(opts.length>=6) break;
  }
  return opts;
}
function conciergeTitle(f){
  const s=f.slots;
  return f.kind==="stay"?("🏠 "+(s.bedrooms?s.bedrooms+"BR ":"")+"stays in "+s.destination):("🛒 "+cap1(s.item));
}
function conciergeSubtitle(f){
  const s=f.slots;
  return f.kind==="stay"?(s.dates.label+", up to $"+s.budget.toLocaleString()+" total"):("up to $"+s.budget.toLocaleString());
}
function conciergeLiveLinks(c){
  const s=c.slots;
  if(c.kind==="stay"){
    const slug=s.destination.split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join("-");

    return '<a href="https://www.airbnb.com/s/'+encodeURIComponent(slug)+'/homes?checkin='+s.dates.checkin+'&checkout='+s.dates.checkout+'&adults='+guests+'" target="_blank" rel="noopener">Airbnb</a> · '+
      '<a href="https://www.vrbo.com/search?destination='+encodeURIComponent(s.destination)+'&startDate='+s.dates.checkin+'&endDate='+s.dates.checkout+'" target="_blank" rel="noopener">Vrbo</a> · '+
      '<a href="https://www.expedia.com/Hotel-Search?destination='+encodeURIComponent(s.destination)+'" target="_blank" rel="noopener">Expedia</a>';

    '<a href="https://www.google.com/search?tbm=shop&q='+q+'" target="_blank" rel="noopener">Google Shopping</a>';
}
