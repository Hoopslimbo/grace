async function runConcierge(refineNote){
  genStart();
  try{
  const f=S.flow||S.concierge; // refineNote reuses the last search's slots
  const keepFlow=!!S.flow;
  S.flow=null;
  if(!f) return;
  const s=f.slots, kind=f.kind;
  setSubtitle("Finding the best options…"); S.orbMode="thinking";
  const what=kind==="stay"
    ?((s.bedrooms?s.bedrooms+"-bedroom ":"")+"cabins / vacation rentals in "+s.destination+". Trip: "+s.dates.label+" ("+s.dates.nights+" nights). Total budget: up to $"+s.budget.toLocaleString())
    :("buy: "+s.item+". Budget: up to $"+s.budget.toLocaleString());
  const n=kind==="stay"?5:4;
  const prompt="The user wants "+what+"."+(refineNote?(" Refinement: "+refineNote+"."):"")+
    " List the "+n+" best SPECIFIC, real options (real brand+model names for products; real well-known cabins, lodges, hotels or vacation-rental style names for stays in that area). Keep prices realistic and within budget."+
    " Reply with ONLY these lines, one option per line, fields separated by ' || ' — no intro, no numbering, no conclusion:\n"+
    "NAME || PRICE (number only, no $ or commas) || WHY_IT_FITS (max 10 words) || ONE_DOWNSIDE (max 10 words)";
  let opts=[];
  try{
    const raw=await brainRaw(prompt,"You are a shopping and travel assistant. Follow the user's format exactly — only the option lines, nothing else.",20000);
    opts=parseOptions(raw,kind,s);
  }catch(e){}
  S.concierge={kind:kind,slots:s,options:opts,title:conciergeTitle(f),subtitle:conciergeSubtitle(f)};
  conciergeCard();
  if(!opts.length){
    speak("My recommendation brain isn't responding right now — but the live search links are in the window, and those always have current options and prices.");
    return;
  }
  const priced=opts.filter(o=>o.price!=null);
  const cheapest=priced.length?priced.reduce((a,b)=>a.price<b.price?a:b):opts[0];
  speak("I found "+opts.length+" options for "+S.concierge.subtitle+". "+
    (cheapest.price!=null?("Cheapest is "+cheapest.name+" at about "+cheapest.priceLabel+". "):"")+
    "They're in the window — tap one to open it in a new tab, or say 'open number 2'.");
  }finally{ genEnd(); }
}
// follow-ups while a result list is showing
async function conciergeFollowup(tl,text){
  const c=S.concierge;
  let m=tl.match(/(?:open|show)\s+(?:number|option)\s*(\d+)/)||tl.match(/^number\s*(\d+)/);
  if(m){
    const i=parseInt(m[1],10)-1;
    if(c.options[i]){ openUrl(c.options[i].url,c.options[i].name,"Opening "+c.options[i].name+"."); }
    else speak("I only have "+c.options.length+" options — pick 1 through "+c.options.length+".");
    return true;
  }
  if(/\bcompare\b/.test(tl)){
    m=tl.match(/compare\s+(?:option\s+|number\s+)?(\d+)\s+and\s+(?:option\s+|number\s+)?(\d+)/)||tl.match(/compare\s+(?:the\s+)?first\s+two/);
    let a,b;
    if(m&&m[1]){ a=c.options[parseInt(m[1],10)-1]; b=c.options[parseInt(m[2],10)-1]; }
    else if(c.options.length>=2){ a=c.options[0]; b=c.options[1]; }
    if(!a||!b){ speak("Say something like 'compare 1 and 2'."); return true; }
    setSubtitle("Comparing…");
    try{
      const raw=await brainRaw("Compare these two options for a buyer, in 3 short sentences max. Be decisive about which is better and for whom:\n1) "+a.name+" ("+a.priceLabel+") — "+a.why+". Downside: "+a.con+"\n2) "+b.name+" ("+b.priceLabel+") — "+b.why+". Downside: "+b.con,
        "You are a decisive shopping assistant. Short comparison, pick a winner.",15000);
      const ans=firstSentences(raw,3);
      showAnswerCard({title:a.name+" vs "+b.name,image:null,text:ans});
      addMsg("luna",ans);
      speak(ans,{chat:false,onDone:()=>{ if(!S.muted) cardUntilDone(); }});
    }catch(e){ loadFail(); }
    return true;
  }
  if(/\bcheaper\b|\bless expensive\b/.test(tl)){ await runConcierge("go cheaper — aim roughly 30% under the previous prices"); return true; }
  if(/\bpricier\b|\bmore expensive\b|\bnicer\b|\bfancier\b|\bluxury\b|\bupgrade\b/.test(tl)){ await runConcierge("go higher-end — nicer options, budget can stretch about 40% higher"); return true; }
  if(/(show|find|get)( me)? more/.test(tl)||/\bmore options\b/.test(tl)){
    setSubtitle("Finding more options…");
    try{
      const names=c.options.map(o=>o.name).join("; ");
      const raw=await brainRaw("The user wants "+(c.kind==="stay"?("places to stay: "+c.slots.destination):("to buy: "+c.slots.item))+". List 4 MORE specific, real options DIFFERENT from these: "+names+". Same format, one per line, fields separated by ' || ': NAME || PRICE (number only) || WHY_IT_FITS (max 10 words) || ONE_DOWNSIDE (max 10 words). Only the option lines.",
        "You are a shopping and travel assistant. Only the option lines.",20000);
      const more=parseOptions(raw,c.kind,c.slots).filter(o=>!c.options.some(e=>e.name.toLowerCase()===o.name.toLowerCase()));
      if(more.length){ c.options=c.options.concat(more); conciergeCard(); speak("Added "+more.length+" more — "+c.options.length+" total now. They're in the window."); }
      else speak("I couldn't find more that fit — try 'cheaper' or 'pricier' to widen it.");
    }catch(e){ loadFail(); }
    return true;
  }
  if(/^(new search|start over|search again)/.test(tl)){ S.concierge=null; speak("Okay, fresh search — what are you looking for?"); return true; }
  return false;
}
async function tryConcierge(tl,text){
  // follow-ups on a visible result list take priority
  if(S.concierge&&S.concierge.options&&S.concierge.options.length){
    if(await conciergeFollowup(tl,text)) return true;
  }
  // "open airbnb" / "look up vrbo" alone = just open the site, not a search
  if(/^(open|look up|go to)\s+(airbnb|vrbo|expedia)$/.test(tl)) return false;
  const stayHit=STAY_WORDS.test(tl)&&/^(find|search|look|show|get|need|want|any|i'?m looking)/.test(tl);
  const buyHit=BUY_HINT.test(tl)&&/^(i want|i need|find|search|look|show|get|buy|can you)/.test(tl);
  let kind=null, slots={};
  if(stayHit){
    kind="stay";
    slots.destination=extractDestination(tl);
    const bm=tl.match(/(\d+)\s*bedrooms?/);
    if(bm) slots.bedrooms=parseInt(bm[1],10);
    const d=parseDates(tl); if(d&&d.checkout) slots.dates=d; else if(d) slots.dates=d;
    slots.budget=extractUpfrontBudget(tl);
  }else if(buyHit){
    kind="buy";
    slots.item=extractItem(tl);
    if(!slots.item) return false;
    slots.budget=extractUpfrontBudget(tl);
  }else return false;
  if(!needWeb()) return true;
  S.concierge=null; // fresh search replaces old results
  S.flow={kind:kind,slots:slots,awaiting:null};
  flowNext();
  return true;
}

async function firstVideoId(q){

// find a site's real homepage: brain first (knows the famous ones),
// wikipedia's external links as backup, DDG instant answers last.
async function officialSiteUrl(name){
  genStart();
  try{
  try{
    const raw=await brainRaw(
      "What is the official homepage URL for "+name+"? Reply with ONLY the full URL starting with https:// and nothing else. If you are not sure, reply with exactly: UNKNOWN",
      "You answer with only a URL or the word UNKNOWN. No other text.", 12000);
    const u=(raw||"").trim().split(/\s+/)[0].replace(/^["'“”]+|["'“”.,;!?]+$/g,"");
    if(/^https?:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(u)&&!/unknown/i.test(u)) return u;
  }catch(e){}
  try{
    const token=name.toLowerCase().replace(/\.(com|org|net|gov|io|ai|co|edu)$/,"").replace(/[^a-z0-9]/g,"");
    if(token){
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),8000);
      const j=await (await fetch("https://en.wikipedia.org/w/api.php?action=query&prop=extlinks&titles="+
        encodeURIComponent(name)+"&format=json&origin=*&redirects=1&ellimit=120",{signal:ctrl.signal})).json();
      clearTimeout(to);
      const pages=(j.query&&j.query.pages)||{};
      const badSub=/^(blog|support|help|community|developer|forum|status|careers|making)$/;
      let best=null,bestScore=-1;
      for(const pid in pages){
        for(const e of (pages[pid].extlinks||[])){
          const u=e["*"]||"";
          const m=u.match(/^https?:\/\/([^\/]+)(\/[^?#]*)?/i);
          if(!m) continue;
          const labels=m[1].toLowerCase().split(".");
          if(labels.indexOf(token)<0) continue;
          if(badSub.test(labels[0])) continue;
          const exact=(labels[0]===token)||(labels[0]==="www"&&labels[1]===token);
          const depth=(m[2]||"/").split("/").filter(Boolean).length;
          const score=(exact?10:0)+(depth===0?5:0)-depth;
          if(score>bestScore){ bestScore=score; best=u; }
        }
      }
      if(best) return best;
    }
  }catch(e){}
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),7000);
    const j=await (await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(name+" official site")+"&format=json&no_html=1&skip_disambig=1",{signal:ctrl.signal})).json();
    clearTimeout(to);
    const u=(j.AbstractURL||"").trim();
    if(/^https?:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(u)) return u;
  }catch(e){}
  return null;
  }finally{ genEnd(); }
}
async function tryWeb(tl,text){
  let m;
  // --- explicit "in a window": youtube plays inside a mini window, no tab ---
  m=tl.match(/(?:open|play|show me|pull up)\s+(.+?)\s+(?:on youtube\s+)?in (?:a )?window/);
  if(m){
    if(!needWeb()) return true;
    const q=m[1].trim().replace(/[?.!]+$/,"").replace(/^(?:a|the)\s+/,"");
    if(q){ openYouTubeWindow(q); return true; }
  }
  // --- "play X on spotify": open Spotify with the search pulled up (before youtube's "play X" grabs it) ---
  m=tl.match(/(?:play|listen to)\s+(.+?)\s+on\s+spotify/);
  if(m){
    if(!needWeb()) return true;
    const q=m[1].trim().replace(/[?.!]+$/,"").replace(/^(?:some\s+)?songs?\s+by\s+/i,"");
    if(q){ openSpotifySearch(q); return true; }
  }
  // --- platform-specific: "open 'X' on youtube / google docs / gmail / wikipedia" ---
  // searches that platform itself for the exact title, instead of googling it
  const PLATFORM_URL={
    docs:q=>"https://drive.google.com/drive/search?q="+encodeURIComponent(q),
    gmail:q=>"https://mail.google.com/mail/u/0/#search/"+encodeURIComponent(q),
    wiki:q=>"https://en.wikipedia.org/wiki/Special:Search?search="+encodeURIComponent(q)
  };
  m=tl.match(/(?:open(?: up)?|find|show me|pull up|search)\s+(?:a\s+|the\s+|my\s+)?["'“”]?(.+?)["'“”]?\s+(?:on|in)\s+(youtube|google\s+docs?|docs?|google\s+drive|drive|gmail|e-?mail|wikipedia|wiki)\s*$/);
  if(m){
    let q=m[1].trim().replace(/^(?:a\s+)?video\s+(?:of|about|on)\s+/i,"");
    const platRaw=m[2].toLowerCase().replace(/\s+/g," ").replace(/^google\s+/,"");
    if(q){
      if(!needWeb()) return true;
      if(platRaw==="youtube"){ openYouTubeFirst(q); return true; }
      const key=/mail/.test(platRaw)?"gmail":/wiki/.test(platRaw)?"wiki":"docs";
      const label={docs:"Google Docs",gmail:"Gmail",wiki:"Wikipedia"}[key];
      openUrl(PLATFORM_URL[key](q),"Search "+label,"Looking for "+q+" in your "+label+".");
      return true;
    }
    // no title captured: fall through to the patterns below
  }
// --- youtube: singular "video" -> autoplay the FIRST result (a real video, not a Short) ---
  m=tl.match(/(?:open(?: up)?|play|pull up|show me|find)\s+(?:a\s+)?(?:youtube\s+)?video\s+(?:of|about|on)?\s*(.+)/);
  if(m){
    if(!needWeb()) return true;
    const q=m[1].trim().replace(/[?.!]+$/,"");
    if(q){ openYouTubeFirst(q); return true; }
  }
  // --- youtube videos: "pull up videos of X", "play X on youtube", "open videos about X", "youtube X", "play X" ---
  m=tl.match(/(?:open(?: up)?|pull up|play|show me|find|search for|look up)\s+(?:a\s+)?(?:youtube\s+)?videos\s+(?:of|about|on)?\s*(.+)/)
    || tl.match(/(?:play|pull up|show me|open(?: up)?)\s+(.+?)\s+on\s+youtube/)
    || tl.match(/^youtube\s+(.+)/)
    || tl.match(/^play\s+(.+)/);
  if(m){
    if(!needWeb()) return true;
    const q=m[1].trim().replace(/[?.!]+$/,"");
    if(q){ openYouTubeSearch(q); return true; }
  }
  // --- a specific google doc -> drive search (you need to be signed in) ---
  m=tl.match(/(?:open(?: up)?|pull up|go to|find)\s+(?:my\s+)?(?:google\s+)?docs?(?:\s+(?:called|named|titled)\s+(.+))?$/);
  if(m){
    if(!needWeb()) return true;
    if(m[1]&&m[1].trim()){
      const q=m[1].trim().replace(/[?.!]+$/,"");
      openUrl("https://drive.google.com/drive/search?q="+encodeURIComponent(q),"Drive search for "+q,"Searching your Google Drive for "+q+".");
    }else openUrl("https://docs.google.com","Google Docs","Opening Google Docs.");
    return true;
  }
  // --- make a google doc (optionally titled) -> fresh doc + title on the clipboard ---
  // a web page can't name the doc via Google's API without a login flow, so we
  // open a new doc and copy the title for one paste.
  m=tl.match(/(?:make|create|start|write)\s+(?:me\s+)?a\s+(?:new\s+)?(?:google\s+)?docs?(?=\s|$)(?:\s+on\s+(?:google\s+)?docs?)?(?:\s+(?:called|named|titled)\s+(.+))?/);
  if(m){
    if(!needWeb()) return true;
    const title=(m[1]||"").trim().replace(/^["'“”]+|["'“”]+$/g,"").replace(/[?.!]+$/,"");
    openUrl("https://docs.google.com/document/create","New Google Doc","Opening a fresh Google Doc"+(title? ", for "+title : "")+".");
    if(title){
      try{ if(navigator.clipboard) navigator.clipboard.writeText(title); }catch(e){}
      addMsg("luna","","I can't name it directly from here, but I copied <b>"+esc(title)+"</b> — click the title at the top of the doc and paste it.");
    }
    return true;
  }
  // --- quoted title: "open 'Greatest speech ever'" -> play that exact video ---
  m=tl.match(/(?:open(?: up)?|play)\s+["'“”](.+?)["'“”]/);
  if(m){
    if(!needWeb()) return true;
    const q=m[1].trim();
    if(q){ openYouTubeFirst(q); return true; }
  }
  // --- generic open / go to ---
  m=tl.match(/^(?:open(?: up)?|go to|launch|visit|pull up)\s+(.+)/);
  if(m){
    if(!needWeb()) return true;
    const raw=m[1].trim().replace(/[?.!]+$/,"");
    // compound: "open spotify and play songs by michael jackson"
    const andM=raw.match(/^(.+?)\s+and\s+(play|playing|listen to|search for|find|show me)\s+(.+)$/i);
    if(andM){
      const sitePart=andM[1].trim(), verb=andM[2].toLowerCase(), thing=andM[3].trim().replace(/[?.!]+$/,"");
      const siteKey=sitePart.toLowerCase().replace(/^(?:the|a|my)\s+/,"").replace(/\s+(?:website|web ?site|site|page|app)$/,"");
      if(/spotify/.test(siteKey)&&/play|listen/.test(verb)){
        const q=thing.replace(/^(?:some\s+)?songs?\s+by\s+/i,"").trim();
        if(q){ openSpotifySearch(q); return true; }
      }
      if(/youtu\.?be/.test(siteKey)){ await openYouTubeFirst(thing); return true; }
      // any other site + action: open the real homepage; the in-page action is theirs
      setSubtitle("Finding the official site…");
      const found=await officialSiteUrl(siteKey);
      if(found) openUrl(found,"Opening "+sitePart,"Opening "+sitePart+". I can't click around inside pages, so the "+thing+" part is all you.");
      else openUrl("https://www.google.com/search?q="+encodeURIComponent(sitePart),"Search "+sitePart,"I couldn't find the official page for "+sitePart+", so here are search results instead.");
      return true;
    }
    // normalize: "open the youtube app" -> key "youtube"
    const key=raw.toLowerCase().replace(/^(?:the|a|my)\s+/,"").replace(/\s+(?:website|web ?site|site|page|app)$/,"");
    let url,label;
    if(SITE_SHORTCUTS[key]){ url=SITE_SHORTCUTS[key]; label="Opening "+raw; }
    else if(/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(raw.replace(/\s+/g,""))){ const d=raw.replace(/\s+/g,""); url="https://"+d; label="Opening "+d; }
    else{
      // "open the NASA website" / "open nasa" -> find the real homepage and open it directly
      setSubtitle("Finding the official site…");
      const found=await officialSiteUrl(key);
      if(found){ url=found; label="Opening "+raw; }
      else{ url="https://www.google.com/search?q="+encodeURIComponent(raw); label="Searching Google for "+raw; }
    }
    openUrl(url,label,label+".");
    return true;
  }
  m=tl.match(/^(?:research|look up|search(?: the web)? for)\s+(.+)/);
  if(m){
    const q=m[1].trim().replace(/[?.!]+$/,"");
    if(q){ await answerFromResearch(text,q); return true; }
  }
  m=tl.match(/^google\s+(.+)/);
  if(m){
    if(!needWeb()) return true;
    const q=m[1].trim();
    const url="https://duckduckgo.com/?q="+encodeURIComponent(q);
    addMsg("luna",'', 'Searching the web for <b>'+esc(q)+'</b>: <a href="'+url+'" target="_blank" rel="noopener">open results</a>');
    setSubtitle("Here are web results for "+q+".");
    utter("Here are web results for "+q+". I've put a link in the transcript.");
    try{ window.open(url,"_blank"); }catch(e){}
    return true;
  }
  return false;
}

    if(new RegExp("\\bwhat does "+kr+" mean\\b").test(tl)||new RegExp("\\bdefine "+kr+"\\b").test(tl)||new RegExp("\\bwhat'?s "+kr+"\\b").test(tl)){
      speak(cap1(k)+" means "+SLANG[k]+".");
      return true;
    }
  }
  // user just drops slang casually → vibe with it
  if(/\b(skibidi|rizz|gyatt|ohio|sigma|bussin|no cap|frfr|delulu|slay|ate that)\b/.test(tl)&&tl.length<50&&!/what does|define|mean/.test(tl)){
    const r=[
      "Haha, got it. What's next?",
      "Loud and clear. What do you need?",
      "Understood — every word.",
      "Noted. What can I do for you?"
    ];
    speak(r[Math.floor(Math.random()*r.length)]);
    return true;
  }
  return false;
}

/* ---------------- wikipedia ---------------- */
async function wikiLookup(query){
  const o=await fetch("https://en.wikipedia.org/w/api.php?action=opensearch&search="+encodeURIComponent(query)+"&limit=1&format=json&origin=*").then(r=>r.json());
  if(!o[1]||!o[1].length) return null;
  const title=o[1][0], link=o[3][0];
  let extract=null, thumb=null;
  try{
    const s=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title)).then(r=>r.json());
    if(s.extract) extract=s.extract;
    if(s.thumbnail&&s.thumbnail.source) thumb=s.thumbnail.source;
  }catch(e){}
  return {title,link,extract,thumb};
}
function firstSentences(txt,n){
  const parts=txt.match(/[^.!?]+[.!?]+/g)||[txt];
  return parts.slice(0,n).join(" ").trim();
}
/* ---------------- web research: look it up herself, then explain it like she knows it ---------------- */
async function webResearch(query){
  const parts=[];
  const to=ms=>{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); return {signal:c.signal,done:()=>clearTimeout(t)}; };
  // source 1: DuckDuckGo instant answers
  try{
    const {signal,done}=to(9000);
    const j=await (await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(query)+"&format=json&no_html=1&skip_disambig=1",{signal})).json();
    done();
    if(j.AbstractText) parts.push("Source: "+(j.AbstractSource||"DuckDuckGo")+"\n"+j.AbstractText);
    (j.RelatedTopics||[]).slice(0,3).forEach(t=>{ if(t&&t.Text) parts.push("Related: "+t.Text); });
  }catch(e){}
  // sources 2-3: Wikipedia article summaries
  try{
    const {signal,done}=to(9000);
    const o=await (await fetch("https://en.wikipedia.org/w/api.php?action=opensearch&search="+encodeURIComponent(query)+"&limit=3&format=json&origin=*",{signal})).json();
    done();
    for(const title of (o[1]||[]).slice(0,2)){
      try{
        const s2=to(9000);
        const s=await (await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title),{signal:s2.signal})).json();
        s2.done();
        if(s.extract) parts.push("Source: Wikipedia ("+title+")\n"+s.extract.slice(0,1500));
      }catch(e){}
    }
  }catch(e){}
  return parts;
}
async function answerFromResearch(question,query){
  if(!needWeb()) return true;
  genStart();
  try{
  hideAnswerCard();
  S.orbMode="thinking";
  setSubtitle("Looking that up…");
  utter("On it — looking that up now.");
  const parts=await webResearch(query);
  if(!parts.length){
    // truly nothing found anywhere → fall back to opening web results
    const url="https://duckduckgo.com/?q="+encodeURIComponent(query);
    showAnswerCard({title:cap1(query),image:null,text:"I couldn't find anything solid on that — I opened web results instead."});
    addMsg("luna","",'I couldn\'t find anything solid on <b>'+esc(query)+'</b> — <a href="'+url+'" target="_blank" rel="noopener">open web results</a>');
    setSubtitle("Couldn't find much — opened web results.");
    utter("I couldn't find anything solid on that, so I opened web results in a new tab.",()=>{ if(!S.muted) cardUntilDone(); });
    try{ window.open(url,"_blank"); }catch(e){}
    return true;
  }
  setSubtitle("Putting it together…");
  const ctx=parts.join("\n\n").slice(0,4500);
  try{
    const ans=await brainRaw(
      "The user asked: \""+question+"\". Here is what I found online about \""+query+"\":\n\n"+ctx+"\n\nNow answer their question briefly (2-4 sentences), in your own words, like you already knew it. Do not say you looked anything up, do not name any sources, no bullet lists.",
      "You are "+S.aiName+", a friendly voice assistant. Answer briefly and naturally, as if from your own knowledge.", 25000);
    if(!ans||ans.length<2) throw 0;
    const brief=firstSentences(ans,3);
    showAnswerCard({title:cap1(query),image:null,text:brief});
    addMsg("luna","", "<b>"+esc(cap1(query))+"</b><br>"+esc(ans));
    speak(brief,{chat:false,onDone:()=>{ if(!S.muted) cardUntilDone(); }});
  }catch(e){
    loadFail();
  }
  return true;
  }finally{ genEnd(); }
}
async function tryWiki(tl,text){
  let m=tl.match(/^(?:who['’]?s|who is|who are|who was|what['’]?s|what is|what are|what was|what does|tell me about|define|describe|explain|where is|where are)\s+(.+)/);
  let q=m?m[1].trim().replace(/\?$/,"").replace(/\s+means?$/i,""):null;
  if(!q) return false;
  if(!needWeb()) return true;
  hideAnswerCard();
  setSubtitle("Looking that up…");
  utter("Looking that up.");
  try{
    const w=await wikiLookup(q);
    if(!w){
      // nothing on Wikipedia at all → research the web and explain it herself
      return await answerFromResearch(text,q);
    }
    if(!w.extract){
      // found a related page but no summary → research the web and explain it herself
      return await answerFromResearch(text,q);
    }
    const spoken=firstSentences(w.extract,2);
    showAnswerCard({title:w.title,image:w.thumb,text:spoken});
    addMsg("luna",'', "<b>"+esc(w.title)+"</b><br>"+esc(w.extract)+'<br><a href="'+esc(w.link)+'" target="_blank" rel="noopener">Read more on Wikipedia</a>');
    speak(spoken,{chat:false,onDone:()=>{ if(!S.muted) cardUntilDone(); }});
  }catch(e){ loadFail(); }
  return true;
}

function mdInline(s){
  let h=esc(s);
  h=h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  h=h.replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<i>$2</i>");
  return h;
}
function mdLite(t){
  const lines=String(t).split("\n");
  let html="", list=null;
  const closeList=()=>{ if(list){ html+="</"+list+">"; list=null; } };
  for(const ln of lines){
    const tr=ln.trim();
    if(!tr){ closeList(); continue; }
    let m=tr.match(/^(#{1,3})\s+(.*)/);
    if(m){ closeList(); const lv=Math.min(3,m[1].length)+2; html+="<h"+lv+">"+mdInline(m[2])+"</h"+lv+">"; continue; }
    if(m=tr.match(/^(\d+)[.)]\s+(.*)/)){ if(list!=="ol"){ closeList(); html+="<ol>"; list="ol"; } html+="<li>"+mdInline(m[2])+"</li>"; continue; }
    if(m=tr.match(/^[-*\u2022]\s+(.*)/)){ if(list!=="ul"){ closeList(); html+="<ul>"; list="ul"; } html+="<li>"+mdInline(m[1])+"</li>"; continue; }
    closeList(); html+="<p>"+mdInline(tr)+"</p>";
  }
  closeList();
  return html||("<p>"+mdInline(String(t))+"</p>");
}

const BRIEF_NUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
/* tech news briefing — shared by tryBriefing and the wildcard surprise */
async function techBriefing(n){
  const today=new Date().toDateString();
  // tech: pull the actual top stories from Hacker News, then brief them
  setSubtitle("Gathering today's top tech stories…");
  utter("On it — pulling today's top tech stories.");
  let stories=[];

    const ids=await (await fetch("https://hacker-news.firebaseio.com/v0/topstories.json",{signal:c1.signal})).json();
    clearTimeout(t1);
    for(const id of (ids||[]).slice(0,20)){

function mailStep(step){

// tolerant parser for the brain's SUBJECT:/BODY: replies — models love to add
// markdown bold, lowercase labels, or a chatty preamble, which used to make
// drafting silently fall back to echoing the raw "about" text
function parseMailDraft(raw){
  if(!raw) return {subject:"",body:""};
  let t=String(raw).replace(/\r/g,"").replace(/\*\*/g,"").replace(/`/g,"").trim();
  const sm=t.match(/^subject\s*:\s*(.+)$/mi);
  let subject=sm?sm[1].trim():"", body="";
  const bi=t.search(/^body\s*:/mi);
  if(bi>=0){
    body=t.slice(bi).replace(/^body\s*:\s*/i,"").trim();
    const cut=body.search(/^\s*subject\s*:/mi); // model put SUBJECT: last
    if(cut>=0) body=body.slice(0,cut).trim();
  }
  if(!subject&&!body){
    // model ignored the format entirely: first line -> subject, rest -> body
    const lines=t.split("\n").map(l=>l.trim()).filter(Boolean);
    if(lines.length){
      subject=lines[0].replace(/^subject\s*:\s*/i,"").slice(0,90);
      body=lines.slice(1).join("\n");
    }
  }
  return {subject,body};
}

/* ---------- first video result with thumbnail (keyless Piped search) ---------- */
async function firstVideo(q){
  const hosts=["https://pipedapi.kavin.rocks","https://pipedapi.adminforge.de","https://pipedapi.reallyaweso.me"];
  for(const h of hosts){
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),7000);
      const r=await fetch(h+"/search?q="+encodeURIComponent(q)+"&filter=videos",{signal:ctrl.signal});
      clearTimeout(to);
      if(!r.ok) continue;
      const j=await r.json();
      const it=(j.items||[]).find(i=>i&&typeof i.url==="string"&&i.url.indexOf("/watch?v=")>-1&&!i.isShort);
      if(it){ const mm=it.url.match(/[?&]v=([^&#]+)/); if(mm) return {id:mm[1],title:(it.title||"").slice(0,80),thumb:it.thumbnail||null}; }
    }catch(e){}
  }
  return null;
}

/* ---------- safety first: health guardrail + scam shield (before any brain call) ---------- */
const HEALTH_RE=/\bshould i take\b|\bcan i take\b|\bdo i need\b.*\b(pill|medicine|medication|drug|tablet|vitamin|supplement)\b|\bdosage\b|\bdose\b|\bhow many .*pills\b|\bside effects?\b|\bdiagnose\b|\bwhat'?s wrong with me\b|\bi feel (dizzy|nauseous?|faint|sick|ill)\b|\bmy (chest|heart|head|stomach|throat)\b.*\b(hurt|pain|ache|tight|burning)\b|\bchest pain\b|\bshort of breath\b|\bblood pressure\b|\bam i (sick|ill)\b/;
const SCAM_RE=/you'?ve (won|been selected)|\bwon\b.*\b(lottery|sweepstakes|prize)|\bgift ?cards?\b.*\b(pay|send|read|scratch)|\bverify your account\b|\baccount.*(suspended|locked|will be closed)\b|\b(social security|irs).*(suspend|arrest|lawsuit|owe|warrant)\b|\bact (now|immediately)\b|\burgent\b.*\b(transfer|payment|verify|action)\b|\bwire\b.*\bmoney\b|\b(bitcoin|crypto).*\batm\b|\bmystery shopper\b|\bstranded\b.*\b(send|wire|money)\b|\b(pay|send).*\bfee\b.*\b(claim|receive|prize|release)\b/i;
async function tryGuardrails(tl,text){
  if(HEALTH_RE.test(tl)){
    const msg="I'm not a doctor, hon, so I can't say what's wrong or what medicine to take. Please call your doctor or pharmacist about that — they'll know what's safe for you.";
    addMsg("luna",msg); speak(msg,{chat:false});
    return true;
  }
  if(SCAM_RE.test(tl)){
    const msg="That sounds like it could be a scam, hon. Please don't send any money or share personal information. Check with a family member first — it's always okay to ask.";
    addMsg("luna",msg); speak(msg,{chat:false});
    return true;
  }
  return false;
}

function toggleNotes(force){

function timeAgo(ts){ const m=Math.floor((Date.now()-ts)/60000); if(m<1) return "just now"; if(m<60) return m+"m ago"; const h=Math.floor(m/60); if(h<24) return h+"h ago"; return Math.floor(h/24)+"d ago"; }
function renderNotesPanel(){
  const box=$("notesList"); if(!box) return; box.innerHTML="";
  const notes=getNotes();
  if(!notes.length){ box.innerHTML='<div class="empty">Nothing here yet. Ask me something and I\'ll keep it here for you.</div>'; return; }
  notes.forEach((n,i)=>{
    const row=document.createElement("div"); row.className="note-row";
    const tmp=document.createElement("div"); tmp.innerHTML=n.html; const txt=(tmp.textContent||"").slice(0,90);
    row.innerHTML='<div class="note-title">'+esc(n.title)+'</div><div class="note-snip">'+esc(txt)+(txt.length>=90?"\u2026":"")+'</div><div class="note-meta">'+timeAgo(n.ts)+'</div>';
    const del=document.createElement("button"); del.className="note-del"; del.textContent="\u2715"; del.title="Delete";
    del.onclick=(e)=>{ e.stopPropagation(); const nn=getNotes(); nn.splice(i,1); setNotes(nn); renderNotesPanel(); };

/* ---------- video, songs, lyrics — forgiving phrasing ---------- */
async function showVideoCard(q){
  q=cleanYtQ(q).replace(/[?.!]+$/,"").trim();
  if(!q){ speak("What video should I find? Try: find me a video of, then describe it."); return true; }
  if(!needWeb()) return true;
  setSubtitle("Finding the video\u2026"); S.orbMode="thinking";
  const hit=await firstVideo(q);
  if(!hit){
    const url="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
    openUrl(url,"YouTube search","I couldn't pull the video itself — here are the top results instead.");
    return true;
  }
  const watch="https://www.youtube.com/watch?v="+hit.id;
  const spoken="Here's the top video"+(hit.title?": "+hit.title:"")+". Tap it to open YouTube.";
  const html='<a href="'+watch+'" target="_blank" rel="noopener"><img src="'+(hit.thumb||"")+'" alt="'+esc(hit.title||q)+'" style="width:100%;border-radius:8px"></a>'+
    '<p style="margin-top:10px;font-size:14px;line-height:1.55">'+esc(spoken)+'</p>'+
    '<p><a href="'+watch+'" target="_blank" rel="noopener">\u25B6 Open on YouTube</a></p>';
  openMini("\u25B6 "+(hit.title||cap1(q)), html);
  addMsg("luna","",'Top video'+(hit.title?': <b>'+esc(hit.title)+'</b>':' for <b>'+esc(q)+'</b>')+'. <a href="'+watch+'" target="_blank" rel="noopener">Open on YouTube</a>');
  speak(spoken,{chat:false});
  return true;
}
async function playSong(q){
  q=cleanYtQ(q).replace(/[?.!]+$/,"").replace(/^(?:the\s+)?songs?\s+(?:by\s+)?/i,"").trim();
  if(!q){ speak("What song should I play? Try: play Amazing Grace."); return true; }
  if(!needWeb()) return true;
  setSubtitle("Finding the song\u2026"); S.orbMode="thinking";
  const hit=await firstVideo(q);
  if(hit){
    const watch="https://www.youtube.com/watch?v="+hit.id;
    openUrl(watch,"Playing: "+(hit.title||q),"");
    const spoken="Playing "+(hit.title||q)+".";
    speak(spoken,{chat:false});
  }else{
    const url="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
    openUrl(url,"YouTube search for "+q,"");
    const spoken="I couldn't start it directly, so here are the top results — the first one is your song.";
    speak(spoken,{chat:false});
  }
  return true;
}
async function tryGraceMedia(tl,text){
  let m;
  m=tl.match(/(?:what are the )?lyrics(?: to| of| for)?\s+(.+)/)||tl.match(/(?:words|lyrics) (?:to|of|for) (?:the song )?(.+)/);
  if(m){
    const song=m[1].trim().replace(/[?.!]+$/,"");
    if(song&&needWeb()){
      setSubtitle("Looking up the lyrics\u2026");
      try{
        const raw=await brainRaw("Print the full lyrics to the song \""+song+"\". If you don't reliably know them, say so in one sentence and do not invent lyrics.",
          "You print song lyrics exactly, or honestly say you don't know them.", 20000);
        const lyr=(raw||"").trim();
        if(/don't know|can't recall|not sure/i.test(lyr)&&lyr.length<120){ speak("I don't reliably know the lyrics to "+song+", hon — I don't want to make them up. Want me to find a video of it instead?"); }
        else{ openDoc("\u{1F3B5} Lyrics: "+cap1(song), mdLite(lyr), lyr); speak("Got the lyrics — they're in the notebook window, and you can copy them with the copy button."); addMsg("luna","","Pulled up the lyrics to <b>"+esc(song)+"</b> — in the notebook window."); }
      }catch(e){ loadFail(); }
      return true;
    }
  }
  m=tl.match(/^play\s+(.+)/);
  if(m&&!/on spotify/.test(tl)){
    const rest=m[1].trim();
    if(/\bvideo\b/.test(rest)) return await showVideoCard(rest);
    return await playSong(rest);
  }
  m=tl.match(/(?:find|pull up|show me|get me|look for|search for|can you find|i (?:want|would like) to (?:see|watch)|let me see|put on)\s+(?:me\s+)?(?:a\s+|the\s+)?(?:youtube\s+)?videos?\s+(?:of|about|on)?\s*(.+)/);
  if(m) return await showVideoCard(m[1]);
  m=tl.match(/(?:show me|find|pull up|put on)\s+(.+?)\s+on\s+youtube/);
  if(m) return await showVideoCard(m[1]);
  return false;
}

/* ---------- simple lists (groceries, to-dos...) in a notebook card ---------- */
function getLists(){ try{ return JSON.parse(localStorage.getItem("grace_lists")||"{}"); }catch(e){ return {}; } }
function setLists(l){ try{ localStorage.setItem("grace_lists",JSON.stringify(l)); }catch(e){} }
function listCard(name){
  const lists=getLists(), items=lists[name]||[];
  const rows=items.length?items.map((it,i)=>"<li>"+esc(it)+"</li>").join(""):"<li><i>Nothing on here yet.</i></li>";
  const html='<div class="notebook"><h3 style="margin-top:0">'+esc(cap1(name))+' list</h3><ol>'+rows+'</ol></div>'+
    '<p class="ctip">Say \u201Cadd milk to my '+esc(name)+' list\u201D, \u201Cremove milk from my '+esc(name)+' list\u201D, or \u201Cclear my '+esc(name)+' list\u201D.</p>';
  openDoc("\u{1F4DD} "+cap1(name)+" list", html, items.map((it,i)=>(i+1)+". "+it).join("\n"));
}
async function tryGraceLists(tl,text){
  const LNAME="(grocery|groceries|shopping|to-?do|todo|packing|christmas|church)";
  let m;
  m=tl.match(new RegExp("(?:add|put) (.+?) (?:to|on) my "+LNAME+" list"));
  if(m){
    const item=m[1].trim().replace(/^(?:a|an|the|some)\s+/,""), name=m[2].replace(/-/g,"");
    const lists=getLists(); lists[name]=lists[name]||[];
    if(!lists[name].some(x=>x.toLowerCase()===item.toLowerCase())) lists[name].push(cap1(item));
    setLists(lists); listCard(name);
    speak("Added "+item+" to your "+name+" list.");
    return true;
  }
  m=tl.match(new RegExp("(?:remove|delete|take) (.+?) from my "+LNAME+" list"));
  if(m){
    const item=m[1].trim(), name=m[2].replace(/-/g,"");
    const lists=getLists(); lists[name]=(lists[name]||[]).filter(x=>x.toLowerCase().indexOf(item.toLowerCase())<0);
    setLists(lists); listCard(name);
    speak("Removed "+item+" from your "+name+" list.");
    return true;
  }
  m=tl.match(new RegExp("(?:clear|empty) my "+LNAME+" list"));
  if(m){ const name=m[1].replace(/-/g,""); const lists=getLists(); lists[name]=[]; setLists(lists); listCard(name); speak("Cleared your "+name+" list."); return true; }
  m=tl.match(new RegExp("(?:what'?s on|show me|read|list)(?: my)? "+LNAME+" list"));
  if(m){ const name=m[1].replace(/-/g,""); listCard(name); const lists=getLists(); const items=lists[name]||[];
    speak(items.length?("Your "+name+" list: "+items.join(", ")+"."):("Your "+name+" list is empty, hon.")); return true; }
  m=tl.match(new RegExp("(?:make|start|write)(?: me)? a "+LNAME+" list"));
  if(m){ const name=m[1].replace(/-/g,""); listCard(name); speak("Started your "+name+" list. Tell me things to add."); return true; }
  return false;
}
